function startPositionSetting() {
  if (!placedModel) return;
  positionSettingActive = true;
  positionToggleButton.textContent = '決定';
  positionToggleButton.classList.add('active');
  psBanner.style.display = 'block';
  psCanvasWrap.style.display = 'block';
  // 従来の位置決め中は、他の位置合わせ方法を同時に開始できないようにする
  orientationAlignButton.disabled = true;
  pointAlignButton.disabled = true;
  confirmViewButton.disabled = true;

  // その時点でのスマホの位置・向きを「基準(不動)」として固定する。
  // これ以降、実際にスマホが動いても、この位置決め画面内の見え方は変わらない。
  const frozenPos = new THREE.Vector3();
  camera.getWorldPosition(frozenPos);
  const frozenForward = getCameraForwardXZ();

  // 手ブレなどでスマホの向きがわずかに斜めだと、表示が傾いてしまうため、
  // 視点方向を最も近いX軸・Z軸方向にスナップし、画面に水平・垂直に表示されるようにする
  const snappedForward = snapToNearestAxis(frozenForward);
  // 続く高さ調整(立面図)で、この「前方向」に対して真横(90度)から見るために使う
  positionSettingForward = snappedForward.clone();

  // 上面図(2D)プレビュー用の、専用の小さなシーン・レンダラー・カメラを用意する
  psScene = new THREE.Scene();
  psPreviewModel = buildFlatPreviewModel(placedModel);
  psScene.add(psPreviewModel);

  const canvas = document.createElement('canvas');
  const pixelRatio = window.devicePixelRatio || 1;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width * pixelRatio;
  canvas.height = height * pixelRatio;
  psCanvasWrap.insertBefore(canvas, psCanvasWrap.firstChild);

  psRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  psRenderer.setPixelRatio(pixelRatio);
  psRenderer.setSize(width, height, false);

  // 画面いっぱいに表示するため、画面の縦横比に合わせて表示範囲を決める
  const halfSizeVertical = 4; // 上下方向に見渡す範囲(メートル)。固定。
  const aspect = width / height;
  const halfSizeHorizontal = halfSizeVertical * aspect;
  psCamera = new THREE.OrthographicCamera(
    -halfSizeHorizontal, halfSizeHorizontal, halfSizeVertical, -halfSizeVertical, 0.1, 100
  );
  psCamera.position.set(frozenPos.x, frozenPos.y + 20, frozenPos.z);
  psCamera.up.set(snappedForward.x, 0, snappedForward.z);
  psCamera.lookAt(frozenPos.x, frozenPos.y, frozenPos.z);
  psCamera.updateProjectionMatrix();
}

// ベクトルを、+X・-X・+Z・-Zのうち最も近い方向にスナップする
function snapToNearestAxis(vector) {
  const candidates = [
    new THREE.Vector3(1, 0, 0),
    new THREE.Vector3(-1, 0, 0),
    new THREE.Vector3(0, 0, 1),
    new THREE.Vector3(0, 0, -1),
  ];
  let best = candidates[0];
  let bestDot = -Infinity;
  candidates.forEach((c) => {
    const dot = c.dot(vector);
    if (dot > bestDot) {
      bestDot = dot;
      best = c;
    }
  });
  return best;
}

// 影・グラデーションのない、のっぺりした表示専用のモデル複製を作る。
// 元の色・透過設定は残しつつ、光源の影響を受けない材質(MeshBasicMaterial)に差し替える。
// 後で毎フレーム透過設定を同期できるよう、元のマテリアルをuserDataに覚えておく。
function buildFlatPreviewModel(source) {
  const clone = source.clone(true);

  const sourceMeshes = [];
  source.traverse((child) => {
    if (child.isMesh && !child.userData.isEdgeOutline) sourceMeshes.push(child);
  });
  const cloneMeshes = [];
  clone.traverse((child) => {
    if (child.isMesh && !child.userData.isEdgeOutline) cloneMeshes.push(child);
  });

  cloneMeshes.forEach((cloneMesh, i) => {
    const sourceMesh = sourceMeshes[i];
    const original = sourceMesh && (Array.isArray(sourceMesh.material) ? sourceMesh.material[0] : sourceMesh.material);
    const color = original && original.color ? original.color.clone() : new THREE.Color(0x999999);
    const flatMat = new THREE.MeshBasicMaterial({ color });
    if (original) {
      flatMat.transparent = original.transparent;
      flatMat.opacity = original.opacity;
    }
    cloneMesh.material = flatMat;
    cloneMesh.userData.sourceMaterial = original || null;

    // 輪郭線もこのメッシュの子として複製されているが、userDataの参照は
    // 複製前のインスタンスのままなので、複製後のものに登録し直す
    // (透過状態に応じた表示/非表示切り替えが効くようにするため)
    const edgeChild = cloneMesh.children.find((c) => c.userData && c.userData.isEdgeOutline);
    cloneMesh.userData.edgeOutline = edgeChild || null;
    if (edgeChild) {
      edgeChild.visible = Boolean(original && original.opacity < 1) && edgeOutlineFeatureEnabled;
    }
  });

  return clone;
}

// のっぺりプレビューの透過設定を、元のモデルの現在の透過設定に同期させる
// (透過スライダーや色フィルターを、位置決め中に操作された場合に反映するため)
function syncPreviewOpacity(previewModel) {
  previewModel.traverse((child) => {
    if (!child.isMesh || !child.userData.sourceMaterial) return;
    child.material.transparent = child.userData.sourceMaterial.transparent;
    child.material.opacity = child.userData.sourceMaterial.opacity;
    child.material.needsUpdate = true;
    if (child.userData.edgeOutline) {
      child.userData.edgeOutline.visible = child.userData.sourceMaterial.opacity < 1 && edgeOutlineFeatureEnabled;
    }
  });
}

// 上から見た位置決め画面(psRenderer等)を後片付けする。
// (「高さ調整画面に進む」時、「初期化」等どちらのタイミングでも使う)
function teardownTopDownPreview() {
  psBanner.style.display = 'none';
  psCanvasWrap.style.display = 'none';
  cancelOrientationAlign();

  if (psPreviewModel) {
    psPreviewModel.traverse((child) => {
      // 輪郭線のマテリアルは本体(placedModel)側と共有しているため、
      // ここで破棄すると本体の輪郭線まで消えてしまう。プレビュー専用の
      // マテリアル(flatMat)だけを破棄する。
      if (child.isMesh && !child.userData.isEdgeOutline && child.material) {
        child.material.dispose();
      }
    });
    psPreviewModel = null;
  }
  psScene = null;

  if (psRenderer) {
    psRenderer.dispose();
    if (psRenderer.domElement.parentNode) {
      psRenderer.domElement.parentNode.removeChild(psRenderer.domElement);
    }
    psRenderer = null;
  }
  psCamera = null;
}

// 立面図(高さ調整)画面を後片付けする
function teardownElevationPreview() {
  elevationBanner.style.display = 'none';
  elevationCanvasWrap.style.display = 'none';
  elevationReferenceLine.style.display = 'none';
  elevationDragHandle.style.display = 'none';

  if (elevationPreviewModel) {
    elevationPreviewModel.traverse((child) => {
      if (child.isMesh && !child.userData.isEdgeOutline && child.material) {
        child.material.dispose();
      }
    });
    elevationPreviewModel = null;
  }
  elevationScene = null;

  if (elevationRenderer) {
    elevationRenderer.dispose();
    if (elevationRenderer.domElement.parentNode) {
      elevationRenderer.domElement.parentNode.removeChild(elevationRenderer.domElement);
    }
    elevationRenderer = null;
  }
  elevationCamera = null;
}

// 上から見た位置決め(XZ)が終わり、「決定」が押されたら、続けて真横から見た
// 立面図(高さ調整)画面に切り替える。placedModel自体はまだ確定しない。
function startHeightAlignment() {
  if (!placedModel) return;
  teardownTopDownPreview();

  heightAlignmentActive = true;
  positionToggleButton.textContent = '高さ決定';

  elevationBanner.style.display = 'block';
  elevationCanvasWrap.style.display = 'block';
  elevationReferenceLine.style.display = 'block';
  elevationDragHandle.style.display = 'block';

  // その時点でのカメラの位置を、赤い基準線の高さ(画面の縦方向の中心)として固定する
  const frozenPos = new THREE.Vector3();
  camera.getWorldPosition(frozenPos);

  const forward = positionSettingForward || getCameraForwardXZ();
  // 位置決めで決めた「前方向」に対して、真横(90度)の方向から見る
  const side = new THREE.Vector3(-forward.z, 0, forward.x).normalize();

  elevationScene = new THREE.Scene();
  elevationPreviewModel = buildFlatPreviewModel(placedModel);
  elevationScene.add(elevationPreviewModel);

  const canvas = document.createElement('canvas');
  const pixelRatio = window.devicePixelRatio || 1;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width * pixelRatio;
  canvas.height = height * pixelRatio;
  elevationCanvasWrap.appendChild(canvas);

  elevationRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  elevationRenderer.setPixelRatio(pixelRatio);
  elevationRenderer.setSize(width, height, false);

  // 画面いっぱいに表示するため、画面の縦横比に合わせて表示範囲を決める。
  // 上下方向(重力方向)の見渡す範囲は固定(±4m)にする(遠近法無し)。
  const halfSizeVertical = 4;
  const aspect = width / height;
  const halfSizeHorizontal = halfSizeVertical * aspect;
  elevationCamera = new THREE.OrthographicCamera(
    -halfSizeHorizontal, halfSizeHorizontal, halfSizeVertical, -halfSizeVertical, 0.1, 100
  );
  // 真横(side方向)から、frozenPos(=画面中央の高さの基準)を見つめる。
  // カメラ自体はこの後動かさない(=赤い基準線は常に画面中央に固定される)。
  elevationCamera.position.copy(frozenPos).addScaledVector(side, 30);
  elevationCamera.up.set(0, 1, 0);
  elevationCamera.lookAt(frozenPos);
  elevationCamera.updateProjectionMatrix();
}

// 立面図(高さ調整)画面で「高さ決定」が押されたら、位置決め全体を完了させる
function finishHeightAlignment() {
  teardownElevationPreview();

  heightAlignmentActive = false;
  positionSettingActive = false;
  positionToggleButton.textContent = '位置決め';
  positionToggleButton.classList.remove('active');
  orientationAlignButton.disabled = false;
  pointAlignButton.disabled = false;
  confirmViewButton.disabled = false;

  // 位置決めを確定したタイミングで状態を保存しておく
  // (この後キーボード・画像選択でセッションが切れても復元できるように)
  saveAppState();
}

// ---- 「2点合わせ」による向き(回転)自動計算 ----
//
// 考え方:
// 1. 実物の壁の線上の2点をAR映像でタップする(奥行きは分からないが、
//    カメラからその点へ向かう「向き(レイ)」は分かる)
// 2. 「2点は同じ高さ(水平線上)にある」という前提を使うと、奥行きが
//    分からなくても、2点を結ぶ方向(水平面上の向き)だけは計算できる
//    (P1.y = P2.y という制約から、奥行きの"比率"が求まるため)
// 3. BIMモデル側で、実物と対応する2点をタップし、そのローカル座標
//    (placedModelの回転に影響されない、モデル本来の向き)から、
//    対応するエッジの水平方向を求める
// 4. 両者の水平方向の角度差を計算し、placedModel.rotation.yに反映する
//    (回転角の符号は実機のthree.jsで検証済み: theta = angleLocal - angleWorld)

function updateOrientationAlignBanner(text) {
  orientationAlignBanner.textContent = text;
  orientationAlignBanner.style.display = text ? 'block' : 'none';
}

// マーカー(oaMarker1=確定済みの1点目)の表示・位置を更新する。
// もう一方の点は、常に画面中央の十字(oaCrosshair)なので専用のマーカーは持たない。
let oaMarker1Pos = null;
let oaCenterPos = null;

function showOaMarker(el, x, y, colorClass) {
  el.className = `orientation-align-marker ${colorClass}`;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.style.display = 'block';
  oaMarker1Pos = { x, y };
}

function hideOaMarker(el) {
  el.style.display = 'none';
  oaMarker1Pos = null;
}

function clearOrientationAlignMarkers() {
  hideOaMarker(oaMarker1);
  oaCenterPos = null;
  oaLineSvg.style.display = 'none';
}

// 1点目と、画面中央(十字)を結ぶ点線を更新する
function updateOaLine() {
  if (!oaMarker1Pos || !oaCenterPos) {
    oaLineSvg.style.display = 'none';
    return;
  }
  oaLine.setAttribute('x1', oaMarker1Pos.x);
  oaLine.setAttribute('y1', oaMarker1Pos.y);
  oaLine.setAttribute('x2', oaCenterPos.x);
  oaLine.setAttribute('y2', oaCenterPos.y);
  oaLineSvg.style.display = 'block';
}

// 確認パネル(「この2点でよいですか？」)を表示する。画面全体は覆わない
// 小さいパネルなので、確認中も点線・十字が見えたままになる。
function showOrientationAlignConfirm(text, onYes, onNo, yesLabel, noLabel) {
  oaConfirmText.textContent = text;
  oaConfirmYesBtn.textContent = yesLabel || 'OK';
  oaConfirmNoBtn.textContent = noLabel || 'やり直す';
  oaConfirmPanel.style.display = 'block';
  oaConfirmPointButton.style.display = 'none';
  oaConfirmYesHandler = onYes;
  oaConfirmNoHandler = onNo;
}

function startOrientationAlign() {
  if (!placedModel) return;
  orientationAlignStep = 1;
  orientationAlignRay1 = null;
  orientationAlignRay2 = null;
  orientationAlignModelPoint1 = null;
  orientationAlignLastHit = null;
  clearOrientationAlignMarkers();
  orientationAlignButton.classList.add('active');
  pointAlignButton.disabled = true;
  confirmViewButton.disabled = true;
  positionToggleButton.disabled = true;
  // 実物の点を狙う間は、BIMが邪魔にならないよう一時的に隠す
  placedModel.visible = false;
  oaCrosshair.style.display = 'block';
  oaConfirmPointButton.style.display = 'block';
  oaConfirmPointButton.disabled = false;
  updateOrientationAlignBanner('① 実物の壁の線上の点(1つ目)に画面中央の十字を合わせて「確定」');
}

function cancelOrientationAlign() {
  orientationAlignStep = 0;
  orientationAlignRay1 = null;
  orientationAlignRay2 = null;
  orientationAlignModelPoint1 = null;
  orientationAlignLastHit = null;
  orientationAlignButton.classList.remove('active');
  pointAlignButton.disabled = false;
  confirmViewButton.disabled = false;
  positionToggleButton.disabled = false;
  updateOrientationAlignBanner('');
  clearOrientationAlignMarkers();
  oaCrosshair.style.display = 'none';
  oaConfirmPointButton.style.display = 'none';
  oaConfirmPanel.style.display = 'none';
  // 隠したままキャンセルされた場合に備えて、必ず表示に戻す
  if (placedModel) placedModel.visible = true;
}

// 画面座標からplacedModelへレイキャストし、ヒットした点(ワールド座標)を返す
// (通り芯・輪郭線・既存ピンは対象外にする)
function raycastPlacedModelPoint(clientX, clientY) {
  const ndc = new THREE.Vector2(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(placedModel, true).filter(
    (h) => !isGridLineObject(h.object) && !h.object.userData.isCommentPin
  );
  return hits.length > 0 ? hits[0].point.clone() : null;
}

// 世界座標の方向・点を、画面上のピクセル座標に変換する
function projectDirectionToScreen(direction, distance = 10) {
  const camPos = new THREE.Vector3();
  camera.getWorldPosition(camPos);
  const point = camPos.clone().addScaledVector(direction, distance);
  return projectWorldPointToScreen(point);
}
function projectWorldPointToScreen(worldPoint) {
  const ndc = worldPoint.clone().project(camera);
  return {
    x: (ndc.x * 0.5 + 0.5) * window.innerWidth,
    y: (-ndc.y * 0.5 + 0.5) * window.innerHeight,
  };
}

// 毎フレーム呼ばれる。画面中央の十字を基準に、各ステップの状態を更新する
// (確定済みの1点目は、カメラが動いても実世界のその方向/その場所を
//  指し続けるよう、毎フレーム再投影して追従させる)
function updateOrientationAlignMarkers() {
  if (orientationAlignStep === 0) return;

  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  if (orientationAlignStep === 2 && orientationAlignRay1) {
    const p = projectDirectionToScreen(orientationAlignRay1);
    showOaMarker(oaMarker1, p.x, p.y, 'marker-yellow');
    oaCenterPos = { x: centerX, y: centerY };
    updateOaLine();
  } else if (orientationAlignStep === 3) {
    orientationAlignLastHit = raycastPlacedModelPoint(centerX, centerY);
    oaCrosshair.classList.toggle('hit', Boolean(orientationAlignLastHit));
    oaConfirmPointButton.disabled = !orientationAlignLastHit;
  } else if (orientationAlignStep === 4 && orientationAlignModelPoint1 && placedModel) {
    orientationAlignLastHit = raycastPlacedModelPoint(centerX, centerY);
    oaCrosshair.classList.toggle('hit', Boolean(orientationAlignLastHit));
    oaConfirmPointButton.disabled = !orientationAlignLastHit;
    const worldP = placedModel.localToWorld(orientationAlignModelPoint1.clone());
    const p = projectWorldPointToScreen(worldP);
    showOaMarker(oaMarker1, p.x, p.y, 'marker-green');
    oaCenterPos = { x: centerX, y: centerY };
    updateOaLine();
  }
}

// 「確定」ボタン(画面中央の十字を今の狙いとして記録する)
// 画面中央(NDC座標(0,0))から、カメラを起点とするワールド空間のレイの向きを取得する。
// (十字は画面中央=NDC(0,0)に表示しているので、それと完全に同じ計算方法にする。
//  camera.getWorldDirection()は「カメラの正面(ローカルZ軸)」を返すが、実機の
//  カメラはレンズ特性で投影行列が左右非対称なことがあり、その場合「カメラの
//  正面」と「画面の真ん中」が一致せず、記録した点がズレる原因になっていた)
function getCenterRayDirection() {
  const ndc = new THREE.Vector2(0, 0);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.direction.clone();
}

function confirmOrientationAlignPoint() {
  if (orientationAlignStep === 1) {
    orientationAlignRay1 = getCenterRayDirection();
    orientationAlignStep = 2;
    updateOrientationAlignBanner('② 実物の同じ線上の点(2つ目)に画面中央の十字を合わせて「確定」');
    return;
  }

  if (orientationAlignStep === 2) {
    orientationAlignRay2 = getCenterRayDirection();
    showOrientationAlignConfirm('この2点でよいですか？', () => {
      orientationAlignStep = 3;
      clearOrientationAlignMarkers();
      // ここからBIM側を狙うので、隠していたモデルを表示し直す
      placedModel.visible = true;
      oaConfirmPointButton.style.display = 'block';
      updateOrientationAlignBanner('③ BIMモデル上の、対応するエッジの点(1つ目)に十字を合わせて「確定」');
    }, () => {
      // やり直す: 点1からやり直す
      orientationAlignStep = 1;
      orientationAlignRay1 = null;
      orientationAlignRay2 = null;
      clearOrientationAlignMarkers();
      oaConfirmPointButton.style.display = 'block';
      updateOrientationAlignBanner('① 実物の壁の線上の点(1つ目)に画面中央の十字を合わせて「確定」');
    });
    return;
  }

  if (orientationAlignStep === 3) {
    if (!orientationAlignLastHit) return; // ヒットしていなければ確定しない
    orientationAlignModelPoint1 = placedModel.worldToLocal(orientationAlignLastHit.clone());
    orientationAlignStep = 4;
    updateOrientationAlignBanner('④ BIMモデル上の、対応するエッジの点(2つ目)に十字を合わせて「確定」');
    return;
  }

  if (orientationAlignStep === 4) {
    if (!orientationAlignLastHit) return;
    const localPoint2 = placedModel.worldToLocal(orientationAlignLastHit.clone());
    showOrientationAlignConfirm('この2点でよいですか？', () => {
      finishOrientationAlign(localPoint2);
    }, () => {
      orientationAlignStep = 3;
      orientationAlignModelPoint1 = null;
      clearOrientationAlignMarkers();
      oaConfirmPointButton.style.display = 'block';
      updateOrientationAlignBanner('③ BIMモデル上の、対応するエッジの点(1つ目)に十字を合わせて「確定」');
    });
  }
}

function finishOrientationAlign(modelPoint2Local) {

  // 実物側: 2点が同じ高さ(水平線上)にあるという前提で、奥行きが
  // 分からなくても水平方向を求める(P1.y=P2.yから奥行きの比率が求まる)
  const d1 = orientationAlignRay1;
  const d2 = orientationAlignRay2;
  if (Math.abs(d1.y) < 1e-6) {
    // 1つ目のレイがほぼ水平(y成分がほぼ0)だと比率が計算できないので、
    // 別の2点でやり直してもらう
    updateOrientationAlignBanner('計算できませんでした。もう一度やり直してください');
    cancelOrientationAlign();
    return;
  }
  const k = d2.y / d1.y;
  const worldDir = d2.clone().sub(d1.clone().multiplyScalar(k));
  const angleWorldTarget = Math.atan2(worldDir.z, worldDir.x);

  // BIM側: ローカル座標(現在の回転に影響されない)でのエッジの水平方向
  const modelDirLocal = new THREE.Vector3().subVectors(modelPoint2Local, orientationAlignModelPoint1);
  if (modelDirLocal.x === 0 && modelDirLocal.z === 0) {
    updateOrientationAlignBanner('BIM側の2点が同じ位置です。やり直してください');
    cancelOrientationAlign();
    return;
  }
  const angleModelLocal = Math.atan2(modelDirLocal.z, modelDirLocal.x);

  // rotation.y = angleModelLocal - angleWorldTarget (実機のthree.jsで検証済み)
  let newRotationY = angleModelLocal - angleWorldTarget;
  // -180〜180度の範囲に正規化しておく(見た目の値が分かりやすいように)
  newRotationY = Math.atan2(Math.sin(newRotationY), Math.cos(newRotationY));
  placedModel.rotation.y = newRotationY;

  updateOrientationAlignBanner('向きを合わせました');
  orientationAlignButton.classList.remove('active');
  pointAlignButton.disabled = false;
  confirmViewButton.disabled = false;
  positionToggleButton.disabled = false;
  orientationAlignStep = 0;
  setTimeout(() => {
    if (orientationAlignStep === 0) {
      updateOrientationAlignBanner('');
      clearOrientationAlignMarkers();
    }
  }, 1500);
}

// ---- 「エッジで合わせる」(エッジ1本=2点による位置合わせ) ----
//
// 考え方:
// 1. BIM側で、まず角(コーナー)を1つ選ぶ。次に、その角に繋がるエッジ
//    (直線)の中から1本を選ぶ(2点=角ともう片端、で1本のエッジになる)。
// 2. 実物側では、Depth Sensingと画面中央の十字を使い、BIM側で選んだ
//    2点(角→エッジのもう片端)と同じ場所を、同じ順番でなぞる。
// 3. 重力方向(Y軸)が既知という前提があるため、未知数は「Y軸回転+
//    位置XYZ」の4つだけ。角・エッジ先端という具体的な対応点が2組あれば
//    過不足なく解ける。回転はエッジの方向(2点間)だけで決める。エッジは
//    基線が長いほど1点ごとの深度誤差の影響を受けにくく、角度の精度が
//    安定しやすい

// 番号付きの丸いマーカー(スプライト)を作る。BIM側・実物側の両方で、
// 同じ番号・同じ色を使うことで「同じ点を同じ順番で選ぶ」際の目印にする。
function createPointAlignMarkerSprite(number, colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const colorCss = '#' + colorHex.toString(16).padStart(6, '0');
  ctx.beginPath();
  ctx.arc(64, 64, 58, 0, Math.PI * 2);
  ctx.fillStyle = colorCss;
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 72px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(number), 64, 68);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, sizeAttenuation: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(0.12, 0.12, 0.12);
  sprite.renderOrder = 999;
  return sprite;
}


// BIM専用ビュー(カメラ映像を使わず、ピンチズーム・スライド移動で自由に見る)を
// 開始する。placedModel自体(選択済みの点マーカーごと)を、専用のシーンに
// 一時的に移して、専用のレンダラー・カメラで描画する。
function startPointAlignBimView() {
  const canvas = document.createElement('canvas');
  const pixelRatio = window.devicePixelRatio || 1;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width * pixelRatio;
  canvas.height = height * pixelRatio;
  pointAlignCanvasWrap.appendChild(canvas);

  pointAlignRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  pointAlignRenderer.setPixelRatio(pixelRatio);
  pointAlignRenderer.setSize(width, height, false);

  pointAlignScene = new THREE.Scene();
  const light = new THREE.HemisphereLight(0xffffff, 0x666666, 1.5);
  pointAlignScene.add(light);

  // 実際のplacedModelをそのまま(複製せず)このシーンに移す。選択済みの
  // 点マーカーもplacedModelの子として一緒に付いてくる。
  pointAlignScene.add(placedModel);

  pointAlignCamera = new THREE.PerspectiveCamera(70, width / height, 0.01, 30);
  // その時点のAR側カメラの位置・向きを引き継ぐ(切り替わった瞬間に見え方が
  // 急に変わらないようにするため)
  const camPos = new THREE.Vector3();
  const camQuat = new THREE.Quaternion();
  camera.getWorldPosition(camPos);
  camera.getWorldQuaternion(camQuat);
  pointAlignCamera.position.copy(camPos);
  pointAlignCamera.quaternion.copy(camQuat);
  // 以後の回転操作は、ロール(傾き)が付かないようyaw(左右)・pitch(上下)を
  // 別々に保持して合成する。引き継いだ向きから初期値を求めておく。
  const initialEuler = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ');
  pointAlignYaw = initialEuler.y;
  pointAlignPitch = initialEuler.x;

  pointAlignActivePointers.clear();
  setupPointAlignBimViewGestures();
  pointAlignCanvasWrap.style.display = 'block';
}

// BIM専用ビューを後片付けし、placedModelを元のAR用シーンに戻す
function teardownPointAlignBimView() {
  pointAlignCanvasWrap.style.display = 'none';
  pointAlignActivePointers.clear();

  if (placedModel && placedModel.parent !== scene) {
    scene.add(placedModel);
  }
  pointAlignScene = null;
  pointAlignCamera = null;

  if (pointAlignRenderer) {
    pointAlignRenderer.dispose();
    if (pointAlignRenderer.domElement.parentNode) {
      pointAlignRenderer.domElement.parentNode.removeChild(pointAlignRenderer.domElement);
    }
    pointAlignRenderer = null;
  }
}

// 指1本のドラッグでカメラを回転、指2本のドラッグで平行移動、
// 指2本のピンチでズームする(Pointer Eventsで指の本数を判定し、
// 2本の時はズームと平行移動を同時に検出する)
function setupPointAlignBimViewGestures() {
  const wrap = pointAlignCanvasWrap;

  const getPinchDist = () => {
    const pts = Array.from(pointAlignActivePointers.values());
    if (pts.length < 2) return 0;
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  };
  const getMidpoint = () => {
    const pts = Array.from(pointAlignActivePointers.values());
    if (pts.length < 2) return { x: 0, y: 0 };
    return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
  };

  const bimViewActive = () => pointAlignStep === 1 || confirmViewActive;
  let tapStartX = 0, tapStartY = 0, tapMoved = false;

  wrap.onpointerdown = (event) => {
    if (!bimViewActive()) return;
    wrap.setPointerCapture(event.pointerId);
    pointAlignActivePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointAlignActivePointers.size === 1) {
      pointAlignRotateLastX = event.clientX;
      pointAlignRotateLastY = event.clientY;
      tapStartX = event.clientX;
      tapStartY = event.clientY;
      tapMoved = false;
    } else if (pointAlignActivePointers.size === 2) {
      pointAlignPinchLastDist = getPinchDist();
      const mid = getMidpoint();
      pointAlignPanLastX = mid.x;
      pointAlignPanLastY = mid.y;
      tapMoved = true; // 2本指になった時点で、タップ(ピンを開く)扱いはしない
    }
  };

  wrap.onpointermove = (event) => {
    if (!bimViewActive() || !pointAlignActivePointers.has(event.pointerId)) return;
    pointAlignActivePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (pointAlignActivePointers.size === 1) {
      const dx = event.clientX - pointAlignRotateLastX;
      const dy = event.clientY - pointAlignRotateLastY;
      pointAlignRotateLastX = event.clientX;
      pointAlignRotateLastY = event.clientY;
      if (confirmViewActive) rotateConfirmOrbit(dx, dy); // モデル中心の周りを回る
      else rotatePointAlignCamera(dx, dy);
      if (Math.abs(event.clientX - tapStartX) > 8 || Math.abs(event.clientY - tapStartY) > 8) {
        tapMoved = true;
      }
    } else if (pointAlignActivePointers.size === 2) {
      const dist = getPinchDist();
      const zoomDelta = dist - pointAlignPinchLastDist;
      pointAlignPinchLastDist = dist;

      if (confirmViewActive) {
        zoomConfirmOrbit(zoomDelta);
        const mid = getMidpoint();
        panConfirmOrbit(mid.x - pointAlignPanLastX, mid.y - pointAlignPanLastY);
        pointAlignPanLastX = mid.x;
        pointAlignPanLastY = mid.y;
      } else {
        zoomPointAlignCamera(zoomDelta);
        const mid = getMidpoint();
        const pdx = mid.x - pointAlignPanLastX;
        const pdy = mid.y - pointAlignPanLastY;
        pointAlignPanLastX = mid.x;
        pointAlignPanLastY = mid.y;
        panPointAlignCamera(pdx, pdy);
      }
    }
  };

  const endPointer = (event) => {
    pointAlignActivePointers.delete(event.pointerId);
    // 指の本数が変わった直後に基準位置がずれて急に動いて見えないよう、
    // 残っている指の位置・距離・中点で基準を取り直す
    const pts = Array.from(pointAlignActivePointers.values());
    if (pts.length === 1) {
      pointAlignRotateLastX = pts[0].x;
      pointAlignRotateLastY = pts[0].y;
    } else if (pts.length === 2) {
      pointAlignPinchLastDist = getPinchDist();
      const mid = getMidpoint();
      pointAlignPanLastX = mid.x;
      pointAlignPanLastY = mid.y;
    }
    // 「現在地・コメント確認」中、指1本でドラッグせずそのまま離した(=タップ)場合は、
    // コメントのピンに当たっていればスレッドを開く
    if (confirmViewActive && !tapMoved && pts.length === 0) {
      handleConfirmViewTap(tapStartX, tapStartY);
    }
  };
  wrap.onpointerup = endPointer;
  wrap.onpointercancel = endPointer;
}

// 画面のスライド量(px)を、カメラのローカルの左右・上下方向への移動に変換する
function panPointAlignCamera(dxPx, dyPx) {
  if (!pointAlignCamera) return;
  const PAN_SPEED = 0.004; // メートル/ピクセル(だいたいの目安。実機で調整可)
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(pointAlignCamera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(pointAlignCamera.quaternion);
  pointAlignCamera.position.addScaledVector(right, -dxPx * PAN_SPEED);
  pointAlignCamera.position.addScaledVector(up, dyPx * PAN_SPEED);
}

// 2本指の中点の移動量(px)を、カメラの向き(yaw・pitch)の変化に変換する。
// ロール(傾き)が付かないよう、yaw/pitchを別々に積み上げてから合成する。
function rotatePointAlignCamera(dxPx, dyPx) {
  if (!pointAlignCamera) return;
  const ROTATE_SPEED = 0.006; // ラジアン/ピクセル(だいたいの目安。実機で調整可)
  pointAlignYaw -= dxPx * ROTATE_SPEED;
  pointAlignPitch -= dyPx * ROTATE_SPEED;
  const maxPitch = Math.PI / 2 - 0.05; // 真上・真下を超えて反転しないよう制限する
  pointAlignPitch = Math.max(-maxPitch, Math.min(maxPitch, pointAlignPitch));
  pointAlignCamera.quaternion.setFromEuler(new THREE.Euler(pointAlignPitch, pointAlignYaw, 0, 'YXZ'));
}

// ピンチ距離の変化量(px)を、カメラの前後移動(ズーム)に変換する
function zoomPointAlignCamera(deltaPx) {
  if (!pointAlignCamera) return;
  const ZOOM_SPEED = 0.006; // メートル/ピクセル(だいたいの目安。実機で調整可)
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(pointAlignCamera.quaternion);
  pointAlignCamera.position.addScaledVector(forward, deltaPx * ZOOM_SPEED);
}

function pointAlignBanner() {
  if (pointAlignStep === 1) {
    if (pointAlignStage === 0) return 'BIM上で、基準にする角(コーナー)をタップして選択してください';
    return 'その角に繋がるエッジを選んでください(エッジの向きが回転の基準になります)';
  }
  if (pointAlignStep === 2) {
    const labels = ['角', 'エッジ先端'];
    const realN = pointAlignRealPointsWorld.length;
    return `実物側で${labels[realN]}に十字を合わせ「確定」(${realN}/2)`;
  }
  return '';
}

function startPointAlign() {
  if (!placedModel) return;
  pointAlignStep = 1;
  pointAlignStage = 0;
  clearPointAlignBimMarkers();
  clearPointAlignRealMarkers();
  pointAlignCornerLocal = null;
  pointAlignEdgeOtherLocal = null;
  pointAlignConnectedEdges = [];

  oaConfirmPointButton.disabled = true;

// 再合わせ: 初回に使ったBIM側の2点を再利用し、実物側の2点だけ測り直す
function startRealign() {

    setTimeout(() => { if (pointAlignStep === 0) updateOrientationAlignBanner(''); }, 2500);

function clearPointAlignBimMarkers() {
  for (const m of pointAlignBimMarkers) {
    if (m.parent) m.parent.remove(m);
  }
  pointAlignBimMarkers = [];
}

function clearPointAlignRealMarkers() {
  for (const m of pointAlignRealMarkers) {
    if (m.parent) m.parent.remove(m);
  }
  pointAlignRealMarkers = [];
}

// BIM側: 画面座標に一番近い、輪郭線の頂点を探す(指定したカメラで投影する)
function findNearestModelVertex(clientX, clientY, maxScreenDist, projCamera) {
  let best = null;
  let bestDist = maxScreenDist;
  const tempWorld = new THREE.Vector3();

  const consider = (mesh, localPoint) => {
    tempWorld.copy(localPoint);
    mesh.localToWorld(tempWorld);
    const ndc = tempWorld.clone().project(projCamera);
    if (ndc.z > 1 || ndc.z < -1) return;
    const sx = (ndc.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-ndc.y * 0.5 + 0.5) * window.innerHeight;
    const dx = sx - clientX, dy = sy - clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < bestDist) {
      bestDist = dist;
      best = { mesh, localPoint: localPoint.clone() };
    }
  };

  for (const seg of modelEdgeSegments) {
    consider(seg.mesh, seg.p1);
    consider(seg.mesh, seg.p2);
  }
  return best;
}

// 指定したワールド座標の角(頂点)に繋がっているエッジを、modelEdgeSegmentsから
// 探す。戻り値は「もう片端(=角と反対側の端点)」の候補一覧。
function findConnectedEdges(cornerWorldPoint, epsilon = 0.02) {
  const result = [];
  for (const seg of modelEdgeSegments) {
    const w1 = seg.mesh.localToWorld(seg.p1.clone());
    const w2 = seg.mesh.localToWorld(seg.p2.clone());
    if (w1.distanceTo(cornerWorldPoint) < epsilon) {
      result.push({ mesh: seg.mesh, localPoint: seg.p2.clone(), worldPoint: w2 });
    } else if (w2.distanceTo(cornerWorldPoint) < epsilon) {
      result.push({ mesh: seg.mesh, localPoint: seg.p1.clone(), worldPoint: w1 });
    }
  }
  return result;
}

// 画面座標に一番近い、候補エッジ(角に繋がるエッジの、もう片端)を探す
function findNearestConnectedEdge(clientX, clientY, candidates, maxScreenDist, projCamera) {
  let best = null;
  let bestDist = maxScreenDist;
  for (const cand of candidates) {
    const ndc = cand.worldPoint.clone().project(projCamera);
    if (ndc.z > 1 || ndc.z < -1) continue;
    const sx = (ndc.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-ndc.y * 0.5 + 0.5) * window.innerHeight;
    const dx = sx - clientX, dy = sy - clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < bestDist) {
      bestDist = dist;
      best = cand;
    }
  }
  return best;
}

// 候補頂点を示すオレンジ色のマーカー。placedModelの子にして、
// BIM専用ビュー・AR用シーンのどちらに居ても正しい位置に表示されるようにする。
function ensurePointAlignPreviewMarker() {
  if (pointAlignPreviewMarker) return;
  const geom = new THREE.SphereGeometry(0.025, 10, 10);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff9800, depthTest: false });
  pointAlignPreviewMarker = new THREE.Mesh(geom, mat);
  pointAlignPreviewMarker.renderOrder = 999;
  pointAlignPreviewMarker.visible = false;
}
function showPointAlignPreviewMarker(mesh, localPoint) {
  ensurePointAlignPreviewMarker();
  if (pointAlignPreviewMarker.parent !== placedModel) {
    placedModel.add(pointAlignPreviewMarker);
  }
  const world = mesh.localToWorld(localPoint.clone());
  pointAlignPreviewMarker.position.copy(placedModel.worldToLocal(world));
  pointAlignPreviewMarker.visible = true;
}
function hidePointAlignPreviewMarker() {
  if (pointAlignPreviewMarker) pointAlignPreviewMarker.visible = false;
}

// 毎フレーム呼ばれる(BIM専用ビュー表示中)。段階(角/エッジ)に応じて、
// 画面中央の十字が指す候補を探して表示する。
function updatePointAlignBimCrosshairPosition() {
  if (!pointAlignCamera) return;
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  if (pointAlignStage === 1) {
    // エッジを選ぶ段階: 角に繋がるエッジだけを対象にする
    const nearest = findNearestConnectedEdge(cx, cy, pointAlignConnectedEdges, 90, pointAlignCamera);
    if (!nearest) {
      pointAlignPendingEdge = null;
      hidePointAlignPreviewMarker();
      oaConfirmPointButton.disabled = true;
      oaCrosshair.classList.remove('hit');
      return;
    }
    pointAlignPendingEdge = nearest;
    showPointAlignPreviewMarker(nearest.mesh, nearest.localPoint);
    oaConfirmPointButton.disabled = false;
    oaCrosshair.classList.add('hit');
    return;
  }

  // 角(stage0)を選ぶ段階: 自由に頂点スナップ
  const nearest = findNearestModelVertex(cx, cy, 60, pointAlignCamera);
  if (!nearest) {
    pointAlignPendingVertex = null;
    hidePointAlignPreviewMarker();
    oaConfirmPointButton.disabled = true;
    oaCrosshair.classList.remove('hit');
    return;
  }
  pointAlignPendingVertex = nearest;
  showPointAlignPreviewMarker(nearest.mesh, nearest.localPoint);
  oaConfirmPointButton.disabled = false;
  oaCrosshair.classList.add('hit');
}

// 「確定」ボタン(BIM側の候補を1つ確定する。段階によって処理が異なる)
function confirmPointAlignBimPoint() {
  if (pointAlignStage === 0) {
    if (!pointAlignPendingVertex) return;
    const { mesh, localPoint } = pointAlignPendingVertex;
    mesh.updateMatrixWorld(true);
    const worldPoint = mesh.localToWorld(localPoint.clone());
    pointAlignCornerLocal = placedModel.worldToLocal(worldPoint.clone());

    pointAlignConnectedEdges = findConnectedEdges(worldPoint);
    if (pointAlignConnectedEdges.length === 0) {
      updateOrientationAlignBanner('この頂点に繋がるエッジが見つかりませんでした。別の角を選んでください');
      pointAlignCornerLocal = null;
      pointAlignPendingVertex = null;
      hidePointAlignPreviewMarker();
      return;
    }

    const sprite = createPointAlignMarkerSprite(1, POINT_ALIGN_COLORS[0]);
    sprite.position.copy(pointAlignCornerLocal);
    placedModel.add(sprite);
    pointAlignBimMarkers.push(sprite);

    hidePointAlignPreviewMarker();
    pointAlignPendingVertex = null;
    pointAlignStage = 1;
    oaConfirmPointButton.disabled = true;
    updateOrientationAlignBanner(pointAlignBanner());
    return;
  }

  // stage 1: エッジのもう片端(B)
  if (!pointAlignPendingEdge) return;
  const { mesh, localPoint } = pointAlignPendingEdge;
  mesh.updateMatrixWorld(true);
  const worldPoint = mesh.localToWorld(localPoint.clone());
  pointAlignEdgeOtherLocal = placedModel.worldToLocal(worldPoint.clone());

  const sprite = createPointAlignMarkerSprite(2, POINT_ALIGN_COLORS[1]);
  sprite.position.copy(pointAlignEdgeOtherLocal);
  placedModel.add(sprite);
  pointAlignBimMarkers.push(sprite);

  hidePointAlignPreviewMarker();
  pointAlignPendingEdge = null;
  pointAlignConnectedEdges = [];
  finishPointAlignBimSelection();
}

function finishPointAlignBimSelection() {
  pointAlignStep = 2;
  pointAlignRealPointsWorld = [];
  clearPointAlignRealMarkers();
  oaConfirmPointButton.style.display = 'block';
  oaConfirmPointButton.disabled = true;
  oaCrosshair.style.display = 'block';
  oaCrosshair.classList.remove('hit');
  teardownPointAlignBimView();
  placedModel.visible = false; // 実物側の点を狙う間は、BIMが邪魔にならないよう隠す
  updateOrientationAlignBanner(pointAlignBanner());
}


// 毎フレーム呼ばれる。BIM選択中(step1)は段階に応じた候補を探し、
// 実物側選択中(step2)はDepth Sensing APIから画面中央(十字)が指す実物までの
// 距離を取得し、暫定の実物側の点(ワールド座標)を計算する。
function updatePointAlignFrame(frame) {
  if (pointAlignStep === 1) {
    updatePointAlignBimCrosshairPosition();
    return;
  }
  if (pointAlignStep !== 2) return;
  pointAlignLiveWorldPoint = null;

  // 「エッジで合わせる」の実物側選択に入った最初のフレームで、Depth Sensing
  // 自体が有効になっているかを案内する(非対応なら、待っても状況は変わらないため)
  if (!arDepthUsage) {
    updateOrientationAlignBanner(
      pointAlignBanner() + '(このデバイス/ブラウザはDepth Sensingに非対応の可能性)'
    );
    oaConfirmPointButton.disabled = true;
    oaCrosshair.classList.remove('hit');
    return;
  }

  if (!frame || typeof frame.getDepthInformation !== 'function') {
    oaConfirmPointButton.disabled = true;
    oaCrosshair.classList.remove('hit');
    return;
  }
  const referenceSpace = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(referenceSpace);
  if (!pose || pose.views.length === 0) {
    oaConfirmPointButton.disabled = true;
    oaCrosshair.classList.remove('hit');
    return;
  }
  let depthInfo = null;
  let depthErrorName = null;
  try {
    depthInfo = frame.getDepthInformation(pose.views[0]);
  } catch (e) {
    depthInfo = null;
    depthErrorName = e && (e.name || e.message) || 'unknown';
  }
  if (!depthInfo) {
    const suffix = depthErrorName ? `(深度エラー:${depthErrorName})` : '(深度取得待ち)';
    updateOrientationAlignBanner(pointAlignBanner() + suffix);
    oaConfirmPointButton.disabled = true;
    oaCrosshair.classList.remove('hit');
    return;
  }
  let depthMeters = 0;
  try {
    depthMeters = depthInfo.getDepthInMeters(0.5, 0.5);
  } catch (e) {
    depthMeters = 0;
  }
  // 0(未取得)や、部屋の中としては現実的でない距離は無効とみなす
  if (!depthMeters || depthMeters < 0.03 || depthMeters > 12) {
    updateOrientationAlignBanner(pointAlignBanner() + `(取得値:${depthMeters.toFixed(2)}m)`);
    oaConfirmPointButton.disabled = true;
    oaCrosshair.classList.remove('hit');
    return;
  }
  const rayOrigin = new THREE.Vector3();
  camera.getWorldPosition(rayOrigin);
  // 画面中央(十字)のレイ = カメラの正面方向。ちょうど画面の中心のピクセルなので、
  // Depth Sensingの深度値(カメラ光軸方向の距離)を、そのままこの向きの距離として使える。
  const rayDir = getCenterRayDirection();
  pointAlignLiveWorldPoint = rayOrigin.clone().addScaledVector(rayDir, depthMeters);
  oaConfirmPointButton.disabled = false;
  oaCrosshair.classList.add('hit');
  updateOrientationAlignBanner(pointAlignBanner());
}

// 「確定」ボタン(実物側の点を1つ確定する)。3点そろったら、
// 自動的に位置合わせの計算・適用まで行う。
function confirmPointAlignRealPoint() {
  if (!pointAlignLiveWorldPoint) return;
  const index = pointAlignRealPointsWorld.length;
  const point = pointAlignLiveWorldPoint.clone();
  pointAlignRealPointsWorld.push(point);

  const sprite = createPointAlignMarkerSprite(index + 1, POINT_ALIGN_COLORS[index]);
  sprite.position.copy(point);
  scene.add(sprite);
  pointAlignRealMarkers.push(sprite);

  if (pointAlignRealPointsWorld.length >= 2) {
    applyPointAlign();
    return;
  }
  updateOrientationAlignBanner(pointAlignBanner());
}

// エッジ(角A→もう片端B)の2点対応だけから、Y軸回転と位置(X,Y,Z)を計算し、
// placedModelに適用する。重力方向(Y軸)が既知という前提があるため、
// 未知数(回転1+位置3=4個)に対し、2点の対応(情報6個)で過不足なく解ける。
//
// 手順:
// 1. 回転: BIM側のエッジ方向(B-A)と、実物側のエッジ方向(B'-A')を、XZ平面上で
//    一致させる角度を解く(2点間の「方向」なので、短い1点1点の深度誤差より
//    角度の精度が安定しやすい=基線が長いほど有利、という考え方)
// 2. 位置: 回転後のBIM側A・Bに対する実物側A'・B'のズレ(オフセット)を
//    平均する。A・Bは具体的な対応点なので、これだけでXYZ全方向の位置が決まる
function applyPointAlign() {
  if (!pointAlignCornerLocal || !pointAlignEdgeOtherLocal) return;
  if (pointAlignRealPointsWorld.length !== 2) return;

  const A = pointAlignCornerLocal.clone().multiplyScalar(currentScale);
  const B = pointAlignEdgeOtherLocal.clone().multiplyScalar(currentScale);
  const [Ar, Br] = pointAlignRealPointsWorld;

  // 回転角(BIM側エッジ方向と実物側エッジ方向を、XZ平面上で合わせる)
  const bimDir = new THREE.Vector3().subVectors(B, A);
  const realDir = new THREE.Vector3().subVectors(Br, Ar);
  const sumDot = bimDir.x * realDir.x + bimDir.z * realDir.z;
  const sumCrossAdj = bimDir.z * realDir.x - bimDir.x * realDir.z;
  const rotationY = Math.atan2(sumCrossAdj, sumDot);

  placedModel.rotation.y = rotationY;
  placedModel.updateMatrixWorld(true);

  const cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
  const rotateXZ = (p) => new THREE.Vector3(
    p.x * cosY + p.z * sinY,
    p.y,
    -p.x * sinY + p.z * cosY
  );
  const Ar2 = rotateXZ(A);
  const Br2 = rotateXZ(B);

  // A・Bそれぞれのズレ(オフセット)の平均 = XYZ全方向の位置
  const offsetA = new THREE.Vector3().subVectors(Ar, Ar2);
  const offsetB = new THREE.Vector3().subVectors(Br, Br2);
  const finalOffset = offsetA.clone().add(offsetB).multiplyScalar(0.5);

  placedModel.position.copy(finalOffset);

  alignRef = { cornerLocal: pointAlignCornerLocal.clone(), edgeOtherLocal: pointAlignEdgeOtherLocal.clone() };
  const wasRealign = realignActive;
  realignActive = false;
  realignButton.classList.remove('active');
  updateOrientationAlignBanner(wasRealign ? '再合わせしました' : 'エッジ(2点)で位置と向きを合わせました');
  pointAlignButton.classList.remove('active');
  orientationAlignButton.disabled = false;
  confirmViewButton.disabled = false;
  positionToggleButton.disabled = false;
  placedModel.visible = true;
  oaCrosshair.style.display = 'none';
  oaCrosshair.classList.remove('hit');
  pointAlignStep = 0;
  pointAlignStage = 0;
  oaConfirmPointButton.style.display = 'none';
  clearPointAlignBimMarkers();
  clearPointAlignRealMarkers();
  setTimeout(() => {
    if (pointAlignStep === 0) updateOrientationAlignBanner('');
  }, 2000);

  saveAppState();
}



// ---- 「現在地・コメント確認」(セッションを切らずに全体を見渡すビュー) ----
//
// 考え方: 「点で合わせる」と同じBIM専用ビュー(別レンダラーで
// カメラ映像を覆い隠し、ピンチズーム・回転・平行移動で自由に見る)を流用し、
// そこに「現在地(緑の矢印)」と「コメントのピン」を重ねて表示するだけの、
// 位置合わせを行わない軽量な確認用モード。ARセッション自体は裏で動いたまま
// なので、位置合わせの結果が失われることはない。

// 現在地を示す矢印マーカー(緑)を作る。先端が常に正面(-Z)を向くよう、
// ジオメトリ自体にあらかじめ回転・オフセットを焼き込んでおく。
function ensureConfirmViewMarker() {
  if (confirmViewMarker) return;
  // transparent:trueにしている理由: three.jsは不透明な物を先に、半透明な物を後に描くため、
  // 不透明のままだと、BIMモデル(半透明)に後から上書きされて薄く見えてしまう。
  // 半透明の仲間に入れ(opacityは1のまま)、renderOrderで最後に描かせて最前面に出す
  const mat = new THREE.MeshBasicMaterial({
    color: 0x00e676, depthTest: false, depthWrite: false,
    transparent: true, opacity: 1, side: THREE.DoubleSide,
  });
  const outlineMat = new THREE.MeshBasicMaterial({
    color: 0x000000, depthTest: false, depthWrite: false,
    transparent: true, opacity: 1, side: THREE.DoubleSide,
  });

  // 地面に沿った矢印(平面図を真上から見ても、位置と向きがはっきり分かるように)
  const arrowShape = new THREE.Shape();
  arrowShape.moveTo(0, 0.28);
  arrowShape.lineTo(-0.16, -0.14);
  arrowShape.lineTo(-0.06, -0.09);
  arrowShape.lineTo(-0.06, -0.28);
  arrowShape.lineTo(0.06, -0.28);
  arrowShape.lineTo(0.06, -0.09);
  arrowShape.lineTo(0.16, -0.14);
  arrowShape.closePath();
  const arrowGeom = new THREE.ShapeGeometry(arrowShape);
  arrowGeom.rotateX(-Math.PI / 2); // 地面(XZ平面)に寝かせる。先端が-Z(前方)を向く
  arrowGeom.translate(0, 0.01, 0); // 床にわずかに浮かせて重なりを防ぐ
  const arrow = new THREE.Mesh(arrowGeom, mat);
  arrow.renderOrder = 1000;
  // 背景(グレーのBIM)に埋もれないよう、黒い縁取りを一回り大きく下に敷く
  const arrowOutline = new THREE.Mesh(arrowGeom, outlineMat);
  arrowOutline.scale.set(1.4, 1, 1.28);
  arrowOutline.renderOrder = 999;

  // 3D視点でも見やすいよう、上に小さなポール+球も立てる
  const poleGeom = new THREE.CylinderGeometry(0.012, 0.012, 0.3, 8);
  const pole = new THREE.Mesh(poleGeom, mat);
  pole.position.y = 0.15;
  pole.renderOrder = 1000;

  const sphereGeom = new THREE.SphereGeometry(0.06, 16, 16);
  const sphere = new THREE.Mesh(sphereGeom, mat);
  sphere.position.y = 0.3;
  sphere.renderOrder = 1000;

  const group = new THREE.Group();
  group.add(arrowOutline);
  group.add(arrow);
  group.add(pole);
  group.add(sphere);
  group.visible = false;
  confirmViewMarker = group;
}

  confirmViewBackButton.style.display = 'none';
  teardownPointAlignBimView();
  if (placedModel) placedModel.visible = true;
}

// モデル全体が収まる位置から、モデル中心を見る軌道カメラを用意する
function initConfirmOrbit() {
  if (!pointAlignCamera || !placedModel) return;
  const box = new THREE.Box3().setFromObject(placedModel);
  const size = box.getSize(new THREE.Vector3());
  confirmOrbit.target.copy(box.getCenter(new THREE.Vector3()));
  const aspect = window.innerWidth / window.innerHeight;
  confirmOrbit.dist = Math.max(size.length() * 0.9, 3) / Math.min(1, aspect); // 縦画面は横幅が狭いので、その分遠くから見る
  confirmOrbit.yaw = pointAlignYaw; // 今向いている方角から見る
  confirmOrbit.pitch = 0.6;
  pointAlignCamera.far = Math.max(500, confirmOrbit.dist * 10);
  pointAlignCamera.updateProjectionMatrix();
  applyConfirmOrbit();
}

function applyConfirmOrbit() {
  if (!pointAlignCamera) return;
  const o = confirmOrbit;
  const cp = Math.cos(o.pitch);
  pointAlignCamera.position.set(
    o.target.x + Math.sin(o.yaw) * cp * o.dist,
    o.target.y + Math.sin(o.pitch) * o.dist,
    o.target.z + Math.cos(o.yaw) * cp * o.dist
  );
  pointAlignCamera.lookAt(o.target);
}

// 指1本のドラッグ: モデル中心の周りを回る
function rotateConfirmOrbit(dxPx, dyPx) {
  const ROTATE_SPEED = 0.006;
  confirmOrbit.yaw -= dxPx * ROTATE_SPEED;
  confirmOrbit.pitch += dyPx * ROTATE_SPEED;
  confirmOrbit.pitch = Math.max(-1.4, Math.min(1.5, confirmOrbit.pitch));
  applyConfirmOrbit();
}

// ピンチ: 中心との距離を変える
function zoomConfirmOrbit(deltaPx) {
  confirmOrbit.dist *= (1 - deltaPx * 0.004);
  confirmOrbit.dist = Math.max(0.5, Math.min(300, confirmOrbit.dist));
  applyConfirmOrbit();
}

// 指2本のドラッグ: 見ている中心を画面の左右・上下方向に平行移動する
function panConfirmOrbit(dxPx, dyPx) {
  if (!pointAlignCamera) return;
  const k = confirmOrbit.dist * 0.0012;
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(pointAlignCamera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(pointAlignCamera.quaternion);
  confirmOrbit.target.addScaledVector(right, -dxPx * k);
  confirmOrbit.target.addScaledVector(up, dyPx * k);
  applyConfirmOrbit();
}

// 毎フレーム呼ばれる。現在地マーカーを、実際のAR側カメラの現在位置・向きに追従させる
// (このビュー用カメラ自体は手動操作なので、現在地は別途マーカーで示す必要がある。
//  3D表示・平面図のどちらに切り替えていても、マーカー自体は常に最新の位置に動く)
function updateConfirmViewFrame() {
  if (!confirmViewActive || !confirmViewMarker) return;
  const pos = new THREE.Vector3();
  camera.getWorldPosition(pos);
  confirmViewMarker.position.copy(pos);
  const fwd = getCameraForwardXZ();
  confirmViewMarker.rotation.y = Math.atan2(-fwd.x, -fwd.z);

  // どの縮尺・距離でも、画面上で同じくらいの大きさ(縦の約1割)に見えるよう、
  // 平面図では表示範囲に、3Dでは視点との距離に合わせて大きさを変える
  let scale = 1;
  if (pointAlignCamera) {
    scale = Math.max(1, pointAlignCamera.position.distanceTo(pos) * 0.18);
  }
  confirmViewMarker.scale.setScalar(scale);

  // 初期位置合わせに使ったBIM上の点(①②)も、同様に画面上で一定の大きさにする
  const sizeInWorld = pointAlignCamera ? pointAlignCamera.position.distanceTo(pos) * 0.06 : 0.12;
  confirmViewRefMarkers.forEach((m) => {
    m.scale.setScalar(Math.max(0.12, sizeInWorld) / (currentScale || 1));
  });

  // コメントのピンも、遠くから見ても点として見える・タップできる大きさにする
  if (pointAlignCamera) {
    const wp = new THREE.Vector3();
    commentPins.forEach((pin) => {
      pin.mesh.getWorldPosition(wp);
      const d = pointAlignCamera.position.distanceTo(wp);
      pin.mesh.scale.setScalar(Math.max(1, (d * 0.03) / 0.025 / (currentScale || 1)));
    });
  }
}

// BIM専用ビュー内で、指1本の「タップ」(ドラッグせず離した)がコメントピンに
// 当たっていれば、そのスレッドを閲覧専用で開く
function handleConfirmViewTap(x, y) {
  const activeCam = getActiveConfirmViewCamera();
  if (!confirmViewActive || !activeCam || !placedModel) return;
  const ndcX = (x / window.innerWidth) * 2 - 1;
  const ndcY = -(y / window.innerHeight) * 2 + 1;
  const raycasterPin = new THREE.Raycaster();
  raycasterPin.setFromCamera(new THREE.Vector2(ndcX, ndcY), activeCam);
  const pinMeshes = commentPins.map((p) => p.mesh);
  const hits = pinMeshes.length > 0 ? raycasterPin.intersectObjects(pinMeshes, true) : [];
  if (hits.length === 0) return;
  const pin = commentPins.find((p) => p.mesh === hits[0].object);
  if (pin) showPinThreadView(pin);
}



// ---- 高さ調整(立面図)のドラッグ操作 ----
// 赤い基準線・カメラは画面上で固定したまま、黄色いハンドルのドラッグ量に
// 応じてplacedModel.position.yを直接動かす(モデル側が画面内で上下する)。
function setupElevationDrag() {
  elevationDragHandle.addEventListener('pointerdown', (e) => {
    if (!placedModel) return;
    e.preventDefault();
    elevationDragging = true;
    elevationDragStartClientY = e.clientY;
    elevationDragStartY = placedModel.position.y;
    elevationDragHandle.setPointerCapture(e.pointerId);
  });

  elevationDragHandle.addEventListener('pointermove', (e) => {
    if (!elevationDragging || !placedModel) return;
    // 立面図カメラは上下±4mの範囲を画面いっぱいに表示しているので、
    // その比率(画面の高さ ÷ 8m)でピクセル差分をメートルに変換する
    const screenHeightPx = window.innerHeight;
    const metersPerPixel = 8 / screenHeightPx;
    const deltaPx = e.clientY - elevationDragStartClientY;
    // 下にドラッグ(clientYが増える)するほどモデルが下がる(-)ようにする
    const deltaMeters = -deltaPx * metersPerPixel;
    placedModel.position.y = elevationDragStartY + deltaMeters;
  });

  const endDrag = (e) => {
    if (!elevationDragging) return;
    elevationDragging = false;
    try { elevationDragHandle.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ }
  };
  elevationDragHandle.addEventListener('pointerup', endDrag);
  elevationDragHandle.addEventListener('pointercancel', endDrag);
}

// モデル内の全メッシュを調べ、使われている色ごとにグループ化する
function buildColorGroups(root) {
  colorGroups.clear();
  root.traverse((child) => {
    if (!child.isMesh || child.userData.isGridLineTube || child.userData.isEdgeOutline) return;
    const materials = Array.isArray(child.material)
      ? child.material
      : [child.material];
    materials.forEach((mat) => {
      if (!mat || !mat.color) return;
      const hex = mat.color.getHexString();
      if (!colorGroups.has(hex)) {
        colorGroups.set(hex, { materials: new Set(), enabled: true });
      }
      colorGroups.get(hex).materials.add(mat);
      mat.userData.transparencyExcluded = false;
    });
  });
}

// 色チェックリストのUIを描画する(スウォッチ自体がボタンになっており、
// ONのときチェックマークが浮かぶ「通り芯」チップと統一したデザイン)
function renderColorFilterList() {
  colorFilterList.innerHTML = '';
  colorGroups.forEach((group, hex) => {
    const label = document.createElement('label');
    label.className = 'color-chip';
    label.style.background = `#${hex}`;

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = group.enabled;
    checkbox.style.display = 'none';

    const check = document.createElement('i');
    check.className = 'color-chip-check';
    check.textContent = '✓';
    check.style.visibility = group.enabled ? 'visible' : 'hidden';

    checkbox.addEventListener('change', () => {
      group.enabled = checkbox.checked;
      check.style.visibility = group.enabled ? 'visible' : 'hidden';
      group.materials.forEach((mat) => {
        mat.userData.transparencyExcluded = !group.enabled;
      });
      if (placedModel) {
        applyOpacity(placedModel, currentOpacity);
      }
    });

    label.appendChild(checkbox);
    label.appendChild(check);
    colorFilterList.appendChild(label);
  });
}

// モデル内の全メッシュに透過設定を適用する。
// ただし、色フィルターで除外(チェックOFF)された色は、常に不透明のまま維持する。
function applyOpacity(object, opacity) {
  object.traverse((child) => {
    if (!child.isMesh || child.userData.isGridLineTube || child.userData.excludeFromOpacity || child.userData.isEdgeOutline) return;
    const materials = Array.isArray(child.material)
      ? child.material
      : [child.material];
    let isTransparentNow = false;
    materials.forEach((mat) => {
      if (!mat) return;
      if (mat.userData.transparencyExcluded) {
        mat.transparent = false;
        mat.opacity = 1;
      } else {
        mat.transparent = opacity < 1;
        mat.opacity = opacity;
        if (opacity < 1) isTransparentNow = true;
      }
      mat.needsUpdate = true;
    });
    // 白い輪郭線は、輪郭ON/OFFトグルがONで、かつ実際に半透明になっている
    // メッシュにだけ見せる(不透明なメッシュ、特に継手のような細かい形状に
    // 付くと見づらいため)
    if (child.userData.edgeOutline) {
      child.userData.edgeOutline.visible = isTransparentNow && edgeOutlineFeatureEnabled;
    }
  });
}

// 現在のカメラ(スマホ)の向きを基準にした、水平方向の「前方」ベクトルを求める
function getCameraForwardXZ() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();
  return dir;
}

// 現在のカメラ(スマホ)の向きを基準にした、水平方向の「右方向」ベクトルを求める
function getCameraRightXZ() {
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  right.y = 0;
  right.normalize();
  return right;
}

// 「前後左右」を、常にその時点でのスマホの向き基準で移動させる。
// 位置決めモード中は、移動が遅く感じないよう1回あたりの移動量を3倍にする。
function moveRelative(direction) {
  if (!placedModel) return;

  const forward = getCameraForwardXZ();
  const right = getCameraRightXZ();
  const step = positionSettingActive ? MOVE_STEP * 3 : MOVE_STEP;

  switch (direction) {
    case 'forward':
      placedModel.position.addScaledVector(forward, step);
      break;
    case 'backward':
      placedModel.position.addScaledVector(forward, -step);
      break;
    case 'right':
      placedModel.position.addScaledVector(right, step);
      break;
    case 'left':
      placedModel.position.addScaledVector(right, -step);
      break;
  }
}

// ボタンを押しっぱなしにすると、タップを連続で押したのと同じように繰り返し実行する。
function bindHold(id, handler, delay = 350, interval = 120) {
  const el = document.getElementById(id);
  let timeoutId = null;
  let intervalId = null;

  function stop() {
    clearTimeout(timeoutId);
    clearInterval(intervalId);
    timeoutId = null;
    intervalId = null;
  }

  el.addEventListener('pointerdown', (e) => {
    // メニューが隠れている間は、誤タッチ防止のため微調整ボタンを常にロックする
    if (rightGroup.classList.contains('collapsed')) return;
    e.preventDefault();
    stop();
    handler();
    timeoutId = setTimeout(() => {
      intervalId = setInterval(handler, interval);
    }, delay);
  });

  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
}

function moveHeight(dy) {
  if (!placedModel) return;
  placedModel.position.y += dy;
}

// 回転は常にモデル自身の中心(placedModelの原点)を軸に行われる
function rotateModel(deg) {
  if (!placedModel) return;
  const currentDeg = THREE.MathUtils.radToDeg(placedModel.rotation.y);
  const snappedDeg = Math.round((currentDeg + deg) / 5) * 5;
  placedModel.rotation.y = THREE.MathUtils.degToRad(snappedDeg);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  // BIM専用ビュー(現在地確認・点選択)が開いていれば、そちらも向きの変化に合わせる
  if (pointAlignRenderer && pointAlignCamera) {
    pointAlignRenderer.setSize(window.innerWidth, window.innerHeight, false);
    pointAlignCamera.aspect = window.innerWidth / window.innerHeight;
    pointAlignCamera.updateProjectionMatrix();
  }
}

// ARセッション開始後、最初のフレームでカメラの正面にモデルを仮配置する
function autoPlaceModel() {
  alignRef = null;
  placedModel = new THREE.Group();

  modelMesh = bimModel.clone();
  modelMesh.position.copy(originOffset).multiplyScalar(-1);
  modelMesh.quaternion.identity();
  placedModel.add(modelMesh);

  // bimModel.clone()で複製されると、通り芯(GridLines)のオブジェクトも
  // 別インスタンスとして複製される。実際に画面に描画されるのはこちら側
  // (modelMesh配下)なので、表示/非表示トグルが効くよう参照を更新する。
  // 輪郭線(edgeOutline)についても同様に、複製後のインスタンスを
  // 各メッシュのuserDataに登録し直す(透過スライダー操作時の表示/非表示
  // 切り替えが、複製後のモデルに対しても効くようにするため)。
  // あわせて、「床壁で合わせる」機能のBIM側頂点スナップで使う、
  // 全輪郭線分(頂点の一覧)もここで構築しておく。
  modelEdgeSegments = [];
  modelMesh.traverse((obj) => {
    if (obj.name === 'GridLines') {
      gridLineObject = obj;
    }
    if (obj.isMesh && !obj.userData.isEdgeOutline) {
      const edgeChild = obj.children.find((c) => c.userData && c.userData.isEdgeOutline);
      obj.userData.edgeOutline = edgeChild || null;
      if (edgeChild) {
        const posAttr = edgeChild.geometry.attributes.position;
        for (let i = 0; i < posAttr.count; i += 2) {
          modelEdgeSegments.push({
            mesh: obj,
            p1: new THREE.Vector3().fromBufferAttribute(posAttr, i),
            p2: new THREE.Vector3().fromBufferAttribute(posAttr, i + 1),
          });
        }
      }
    }
  });

  scene.add(placedModel);

  // 前回、キーボードや画像選択でセッションが切れる前に保存していた状態
  // (位置合わせ結果・コメントピン)が、同じモデル(ファイル名+更新日時)で
  // 残っていれば復元する。
  let savedState = currentModelKey ? loadSavedAppState(currentModelKey) : null;
  if (!savedState) {
    // 完全一致が無い場合でも、「modelKeyを持たない古い形式の中間ファイル」を
    // 読み込んだ直後(lastModifiedが分からずfileName::0で保存されているケース)
    // だけは救済する。ここを単純な「ファイル名一致」にすると、同名だが
    // 中身が違う新しいファイル(lastModifiedが異なる)を選んだ際に、
    // 誤って古いコメント・位置を復元してしまうため、キーを厳密に絞る。
    const legacyKey = `${selectedFileName}::0`;
    const candidates = listAllSavedAppStates().filter(
      (item) => item.modelKey === legacyKey
    );
    if (candidates.length === 1) {
      savedState = candidates[0].state;
      currentModelKey = candidates[0].modelKey;
    }
  }
  if (savedState) {
    applySavedAppState(savedState);
    isResumedSession = true;
  } else {
    // 通常の自動配置: カメラの現在位置から、正面2m先を仮の配置場所にする
    const cameraPos = new THREE.Vector3();
    camera.getWorldPosition(cameraPos);
    const forward = getCameraForwardXZ();

    placedModel.position.copy(cameraPos).addScaledVector(forward, 2);
    placedModel.scale.setScalar(currentScale);
    applyOpacity(placedModel, currentOpacity);
  }

  // 「続きから再開」の場合は、保存済みの位置をそのまま使い、
  // 位置決め(確定操作)を省略して通常のAR画面にそのまま入る
  if (skipPositionSettingOnPlace) {
    skipPositionSettingOnPlace = false;
  } else {
    // 配置したら、続けて位置合わせの方法を選んでもらう
    // (①BIM位置合わせ(従来) ②エッジで合わせる)
    alignMethodChoiceOverlay.style.display = 'flex';
  }
}

function animate() {
  renderer.setAnimationLoop(render);
}

function render(timestamp, frame) {
  // モデルの読み込みは完了しているが、まだ配置していない場合、
  // 最初に有効なフレームが来たタイミングで自動配置する
  if (frame && bimModel && !placedModel) {
    autoPlaceModel();
  }

  // 位置決め画面が開いている間は、上面図プレビューも毎フレーム描画する。
  // (実際のモデルの位置・向き・大きさを、のっぺり表示用の複製に同期させてから描画する)
  if (positionSettingActive && psRenderer && psCamera && psScene && placedModel && psPreviewModel) {
    // 歩いて移動した分、上面図カメラの位置(パン)も毎フレーム追従させる。
    // 向き(上面図の「上」方向)は開始時に固定したまま変えない(歩くたびに画面が回転すると酔うため)。
    const liveCamPos = new THREE.Vector3();
    camera.getWorldPosition(liveCamPos);
    psCamera.position.set(liveCamPos.x, liveCamPos.y + 20, liveCamPos.z);
    psCamera.lookAt(liveCamPos.x, liveCamPos.y, liveCamPos.z);

    psPreviewModel.position.copy(placedModel.position);
    psPreviewModel.quaternion.copy(placedModel.quaternion);
    psPreviewModel.scale.copy(placedModel.scale);
    syncPreviewOpacity(psPreviewModel);
    psRenderer.render(psScene, psCamera);
  }

  // 高さ調整(立面図)画面が開いている間は、そちらも毎フレーム描画する。
  // カメラ自体は固定したまま、モデル側だけを現在の高さに同期させることで、
  // 「赤い基準線は動かず、モデルが上下する」見え方になる。
  if (heightAlignmentActive && elevationRenderer && elevationCamera && elevationScene && placedModel && elevationPreviewModel) {
    elevationPreviewModel.position.copy(placedModel.position);
    elevationPreviewModel.quaternion.copy(placedModel.quaternion);
    elevationPreviewModel.scale.copy(placedModel.scale);
    syncPreviewOpacity(elevationPreviewModel);
    elevationRenderer.render(elevationScene, elevationCamera);
  }

  // ARの表示/非表示。位置合わせ中・現在地確認中は、BIMが必要なので常に表示する
  if (modelMesh) {
    modelMesh.visible = isArModelShown();
  }

  // 「点で合わせる」「現在地・コメント確認」のBIM専用ビューが
  // 開いている間は、そちらも毎フレーム描画する(両機能で同じビューを共用している)
  if (pointAlignStep === 1 && pointAlignRenderer && pointAlignScene && pointAlignCamera) {
    pointAlignRenderer.render(pointAlignScene, pointAlignCamera);
  } else if (confirmViewActive && pointAlignRenderer && pointAlignScene) {
    const activeCam = getActiveConfirmViewCamera();
    if (activeCam) pointAlignRenderer.render(pointAlignScene, activeCam);
  }

  renderer.render(scene, camera);

  // コメント一括表示ONの間、ラベル位置を毎フレーム更新する
  updateCommentLabels();
  updateGridLabels();
  // 「2点合わせ」中、確定済みの1点目マーカーをカメラの動きに追従させる
  updateOrientationAlignMarkers();
  // 「点で合わせる」中、Depth Sensingのデータから実物側の点を毎フレーム計算する
  updatePointAlignFrame(frame);
  // 「現在地・コメント確認」中、現在地マーカーをカメラの現在位置に追従させる
  updateConfirmViewFrame();
}

  </script>
</body>
</html>
