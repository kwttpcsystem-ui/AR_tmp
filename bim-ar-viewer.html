<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BIM AR Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #model-name-label {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 8px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      max-width: 70vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #file-picker {
      position: fixed;
      top: 12px;
      bottom: 90px;
      left: 12px;
      right: 12px;
      z-index: 10;
      text-align: center;
      overflow-y: auto;
    }
    #file-label {
      display: inline-block;
      background: #2196f3;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
    }
    #model-input {
      display: none;
    }
    #right-group {
      display: none;
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      transition: transform 0.2s ease;
    }
    #right-group.collapsed {
      transform: translateX(calc(100% + 20px));
      pointer-events: none;
    }
    #ar-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }
    #ar-controls button {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 8px;
      border: none;
      background: rgba(30,30,30,0.8);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      touch-action: none;
      user-select: none;
    }
    #ar-controls button:active {
      background: rgba(33,150,243,0.9);
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-group span {
      color: #ccc;
      font-size: 11px;
      width: 32px;
      text-align: right;
    }
    #top-right-buttons {
      display: none;
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 20;
      flex-direction: row-reverse;
      gap: 8px;
    }
    #reset-button {
      background: rgba(30,30,30,0.8);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      white-space: nowrap;
    }
    #right-group-tab {
      background: rgba(30,30,30,0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      white-space: nowrap;
    }
    /* 縦画面(片手持ち)用のレイアウト調整 */
    @media (orientation: portrait) {
      #model-name-label { font-size: 13px; padding: 6px 10px; max-width: calc(100vw - 210px); }
      #orientation-align-banner { top: 190px; max-width: 92vw; }
      #ps-banner { top: 64px; max-width: 92vw; font-size: 12px; padding: 8px 12px; }
      /* 縦画面: 左のパネルは画面の中央あたりから出して、右下のメニューと重ならないようにする */
      #opacity-control { bottom: auto; top: 40%; }
      #left-group-tab { bottom: auto; top: 44%; }
      #slider-panel { width: 150px; max-height: 22vh; overflow-y: auto; }
      #grid-toggle-row .grid-chip { font-size: 10px; gap: 1px; }
      #cv-list-panel { width: 82vw; }
    }
    #opacity-control {
      display: none;
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 20;
      align-items: flex-end;
      gap: 8px;
      transition: transform 0.2s ease;
    }
    #opacity-control.collapsed {
      transform: translateX(calc(-100% - 20px));
      pointer-events: none;
    }
    #left-group-tab {
      display: none;
      position: fixed;
      left: 0;
      bottom: 40px;
      z-index: 21;
      background: rgba(30,30,30,0.85);
      color: #fff;
      border: none;
      border-radius: 0 6px 6px 0;
      padding: 14px 6px;
      font-size: 11px;
      writing-mode: vertical-rl;
    }
    #slider-panel {
      background: rgba(30,30,30,0.8);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      width: 195px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #slider-panel .label {
      font-size: 10px;
      color: #ccc;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }
    #slider-panel input[type="range"] {
      width: 100%;
    }
    #grid-panel-divider {
      border-top: 0.5px solid rgba(255,255,255,0.25);
      margin: 2px 0;
    }
    #grid-toggle-row {
      display: flex;
      gap: 4px;
    }
    #grid-toggle-row .grid-chip {
      flex: 1 1 0;
      min-width: 0;
      justify-content: center;
      padding: 5px 2px;
    }
    .grid-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(255,255,255,0.35);
      color: #ccc;
      background: transparent;
    }
    .grid-chip.checked {
      background: #2979ff;
      border-color: #2979ff;
      color: #fff;
    }
    .grid-chip-check {
      font-style: normal;
      font-size: 11px;
      font-weight: bold;
    }
    .reset-tap {
      cursor: pointer;
      text-decoration: underline dotted;
    }
    #btn-rot-90 {
      width: 106px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: rgba(30,30,30,0.8);
      color: #fff;
      font-size: 12px;
      padding: 0 6px;
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: none;
      user-select: none;
    }
    #btn-rot-90:active {
      background: rgba(33,150,243,0.9);
    }
    #orientation-align-button {
      width: 106px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: rgba(30,30,30,0.8);
      color: #fff;
      font-size: 11px;
      padding: 0 4px;
      flex-shrink: 0;
      white-space: nowrap;
      touch-action: none;
      user-select: none;
    }
    #orientation-align-button.active {
      background: #ff9800;
    }
    #point-align-button {
      width: 220px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: rgba(30,30,30,0.8);
      color: #fff;
      font-size: 12px;
      touch-action: none;
      user-select: none;
    }
    #point-align-button.active {
      background: #ff9800;
    }
    #save-record-button,
    #save-json-button {
      width: 106px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: rgba(30,30,30,0.8);
      color: #fff;
      font-size: 12px;
      padding: 0 4px;
      white-space: nowrap;
      touch-action: none;
      user-select: none;
    }
    #point-align-button:disabled,
    #position-toggle-button:disabled,
    #orientation-align-button:disabled {
      opacity: 0.5;
    }
    #orientation-align-banner {
      display: none;
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 22;
      background: rgba(255,152,0,0.9);
      color: #000;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      max-width: 70vw;
      user-select: none;
      -webkit-user-select: none;
    }
    .orientation-align-marker {
      display: none;
      position: fixed;
      z-index: 21;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      border-radius: 50%;
      border: 2px solid #fff;
      pointer-events: none;
    }
    .orientation-align-marker.marker-yellow {
      background: #ffeb3b;
    }
    .orientation-align-marker.marker-green {
      background: #4caf50;
    }
    #oa-crosshair {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 21;
      width: 40px;
      height: 40px;
      pointer-events: none;
    }
    #oa-crosshair .oa-crosshair-h,
    #oa-crosshair .oa-crosshair-v {
      position: absolute;
      background: #ffeb3b;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
    }
    #oa-crosshair .oa-crosshair-h {
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      margin-top: -1px;
    }
    #oa-crosshair .oa-crosshair-v {
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      margin-left: -1px;
    }
    #oa-crosshair.hit .oa-crosshair-h,
    #oa-crosshair.hit .oa-crosshair-v {
      background: #4caf50;
    }
    #oa-confirm-point-button {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 22;
      background: #2979ff;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 36px;
      font-size: 15px;
      font-weight: bold;
    }
    #oa-confirm-point-button:disabled {
      background: #555;
      opacity: 0.6;
    }
    #oa-confirm-panel {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 23;
      background: rgba(20,20,20,0.94);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 12px 18px;
      text-align: center;
      max-width: 90vw;
      color: #fff;
      font-size: 13px;
      user-select: none;
      -webkit-user-select: none;
    }
    #elevation-canvas-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      z-index: 15;
    }
    #elevation-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #post-ar-overlay {
      display: none; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.92); color: #fff;
      flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
      padding: 24px; line-height: 1.7; font-size: 15px;
    }
    #post-ar-resume { background: #2e7d32; color: #fff; border: none; border-radius: 10px; padding: 14px 24px; font-size: 15px; }
    #photo-assign-overlay {
      display: none; position: fixed; inset: 0; z-index: 55; background: #1c1c1c; color: #fff;
      flex-direction: column;
    }
    #photo-assign-header { display: flex; gap: 8px; padding: 10px; align-items: center; background: #111; }
    #photo-assign-model { flex: 1; min-width: 0; padding: 8px; border-radius: 6px; background: #333; color: #fff; border: none; font-size: 13px; }
    #photo-assign-close { background: #555; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
    #photo-assign-list { flex: 1; overflow-y: auto; padding: 10px; }
    .pa-item { background: rgba(255,255,255,0.07); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .pa-item-text { font-size: 14px; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
    .pa-item img { display: block; max-width: 100%; max-height: 160px; object-fit: contain; border-radius: 6px; margin-bottom: 6px; }
    .pa-item button { background: #6a1b9a; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; }
    .pa-item button:disabled { background: #555; }
    #cv-leader-svg { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: visible; z-index: 16; pointer-events: none; display: none; }
    #cv-list-tab {
      display: none; position: fixed; left: 0; top: 72%; transform: translateY(-50%); z-index: 19;
      background: rgba(30,30,30,0.9); color: #fff; border: none; border-radius: 0 10px 10px 0;
      padding: 12px 8px; font-size: 13px; line-height: 1.3;
    }
    #cv-list-panel {
      display: none; position: fixed; left: 0; top: 0; bottom: 0; width: 72vw; max-width: 380px; z-index: 20;
      background: rgba(20,20,20,0.96); color: #fff; overflow-y: auto; padding: 10px; box-sizing: border-box;
    }
    #cv-list-panel h3 { margin: 4px 0 10px; font-size: 15px; }
    .cv-item { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 8px; margin-bottom: 10px; }
    .cv-item-title { font-size: 14px; margin-bottom: 6px; }
    .cv-item img { width: 100%; max-height: 140px; object-fit: contain; border-radius: 6px; display: block; margin-bottom: 6px; }
    .cv-item button { border: none; border-radius: 6px; color: #fff; font-size: 12px; padding: 7px 10px; margin-right: 6px; }
    .cv-item button.view { background: #2979ff; }
    .cv-item button.img { background: #6a1b9a; }
    .cv-item button:disabled { background: #555; }
    #point-align-canvas-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      z-index: 15;
      touch-action: none;
    }
    #point-align-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #elevation-banner {
      display: none;
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 22;
      background: rgba(255,152,0,0.95);
      color: #000;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      max-width: 90vw;
      user-select: none;
      -webkit-user-select: none;
    }
    #elevation-reference-line {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      margin-top: -1px;
      background: #ff3b30;
      z-index: 20;
      pointer-events: none;
    }
    #elevation-drag-handle {
      display: none;
      position: fixed;
      right: 90px;
      top: 50%;
      margin-top: -30px;
      width: 40px;
      height: 60px;
      background: #ffeb3b;
      border: 2px solid #fff;
      clip-path: polygon(50% 0%, 100% 20%, 68% 20%, 68% 80%, 100% 80%, 50% 100%, 0% 80%, 32% 80%, 32% 20%, 0% 20%);
      z-index: 21;
      touch-action: none;
      cursor: ns-resize;
    }
    #position-toggle-button {
      display: block;
      width: 90px;
      background: rgba(30,30,30,0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 12px;
      text-align: center;
    }
    #position-toggle-button.active {
      background: #2196f3;
    }
    #comment-pin-button {
      display: none;
      position: fixed;
      left: 14px;
      top: 60px;
      z-index: 20;
      background: rgba(30,30,30,0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      text-align: center;
    }
    #comment-pin-button.active {
      background: #ff9800;
    }
    #comment-labels-toggle {
      display: none;
      position: fixed;
      left: 14px;
      top: 100px;
      z-index: 20;
      background: rgba(30,30,30,0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      text-align: center;
    }
    #comment-labels-toggle.active {
      background: #2e7d32;
    }
    #confirm-view-button {
      display: none;
      position: fixed;
      left: 14px;
      top: 140px;
      z-index: 20;
      background: rgba(30,30,30,0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      text-align: center;
    }
    #confirm-view-button.active {
      background: #ff9800;
    }
    #comment-labels-container {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }
    .comment-label {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      max-width: 160px;
      pointer-events: none;
      text-align: center;
    }
    .comment-label-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .comment-label-thumb {
      display: block;
      max-width: 100%;
      max-height: 70px;
      border-radius: 4px;
      margin-top: 4px;
      object-fit: contain;
      pointer-events: auto;
      cursor: pointer;
    }
    #image-lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0,0,0,0.92);
      align-items: center;
      justify-content: center;
    }
    #image-lightbox-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90vw;
      max-height: 88vh;
    }
    #image-lightbox-img {
      max-width: 90vw;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 6px;
    }
    #image-lightbox-text {
      margin-top: 12px;
      max-width: 90vw;
      max-height: 18vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.08);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #image-lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
    }
    #grid-labels-container {
      position: fixed;
      inset: 0;
      z-index: 14;
      pointer-events: none;
    }
    .grid-label {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      border: 2px solid #1565c0;
      color: #1565c0;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    /* 音声入力モーダル・ピン操作選択モーダル共通の土台 */
    .voice-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
    }
    .voice-modal-box {
      background: #222;
      border-radius: 10px;
      padding: 20px;
      width: 82vw;
      max-width: 380px;
      color: #fff;
      box-sizing: border-box;
      text-align: center;
    }
    #voice-modal-status {
      font-size: 15px;
      margin-bottom: 12px;
    }
    #voice-modal-transcript {
      background: #111;
      border-radius: 8px;
      padding: 12px;
      min-height: 48px;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .voice-modal-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .voice-modal-buttons button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      color: #fff;
    }
    #voice-modal-ok { background: #2e7d32; display: none; }
    #voice-modal-retry { background: #555; display: none; }
    #voice-modal-cancel { background: #c62828; }
    #keyboard-modal-ok { background: #2e7d32; }
    #keyboard-modal-cancel { background: #c62828; }
    #oa-confirm-yes { background: #2e7d32; }
    #oa-confirm-no { background: #555; }
    #reset-confirm-cancel { background: #555; }
    #reset-confirm-ok { background: #c62828; }
    #image-attach-choose { background: #6a1b9a; }
    #resume-choice-new { background: #555; }
    #resume-choice-resume { background: #2e7d32; }
    #align-method-choice-legacy { background: #555; }
    #align-method-choice-point { background: #2e7d32; }
    #image-attach-skip { background: #555; }
    #pin-action-overlay .voice-modal-box {
      max-height: 76vh;
      overflow-y: auto;
    }
    #pin-action-text {
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.6;
      text-align: left;
      color: #ddd;
    }
    .comment-entry-card {
      border-left: 4px solid #888;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .comment-entry-meta {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }

document.addEventListener('pointerdown', function enterFullscreenOnFirstTap() {
  document.removeEventListener('pointerdown', enterFullscreenOnFirstTap);
  const el = document.documentElement;
  const request = el.requestFullscreen || el.webkitRequestFullscreen ||
    el.mozRequestFullScreen || el.msRequestFullscreen;
  if (request) {
    request.call(el).catch(() => {
      // 全画面化に失敗しても(対応していない環境など)、アプリ自体は通常通り使える
    });
  }
}, { once: true });

// ---- モデルファイル自体のキャッシュ(IndexedDB) ----
// セッションが切れて再読み込みされた際、「同じファイルをもう一度選び直す」
// 手間を省くため、選択されたファイルの中身自体をブラウザ内に保存しておく。
// (localStorageはサイズ制限が厳しく大きなファイルに不向きなため、
//  容量に余裕があるIndexedDBを使う)
// モデルごとに区別するためのキーは「ファイル名 + ファイル自体の最終更新日時」を
// そのまま繋げただけのもの(特別な計算は行わない。同じファイル名の物件が
// 複数あっても、更新日時までまったく同じになることは通常ない)。
const MODEL_CACHE_DB_NAME = 'bimArViewerCache';
const MODEL_CACHE_STORE = 'modelFile';

function computeModelKey(fileName, lastModified) {
  return `${fileName}::${lastModified}`;
}

function openModelCacheDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(MODEL_CACHE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(MODEL_CACHE_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function cacheModelFile(modelKey, file) {
  try {
    const db = await openModelCacheDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(MODEL_CACHE_STORE, 'readwrite');
      tx.objectStore(MODEL_CACHE_STORE).put(file, modelKey);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error('モデルファイルのキャッシュに失敗しました', err);
  }
}

async function loadCachedModelFile(modelKey) {
  try {
    const db = await openModelCacheDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(MODEL_CACHE_STORE, 'readonly');
      const req = tx.objectStore(MODEL_CACHE_STORE).get(modelKey);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.error('キャッシュ済みモデルファイルの読み込みに失敗しました', err);
    return null;
  }
}

async function clearCachedModelFile(modelKey) {
  try {
    const db = await openModelCacheDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(MODEL_CACHE_STORE, 'readwrite');
      tx.objectStore(MODEL_CACHE_STORE).delete(modelKey);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    // 何もしない
  }
}

async function listCachedModelKeys() {
  try {
    const db = await openModelCacheDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(MODEL_CACHE_STORE, 'readonly');
      const req = tx.objectStore(MODEL_CACHE_STORE).getAllKeys();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    return [];
  }
}

fileInput.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;

  if (!/\.(glb|gltf)$/i.test(file.name)) {
    fileLabel.textContent = '.glbまたは.gltfファイルを選択してください';
    return;
  }

  // このファイル(名前+更新日時)専用のキーで、既に保存データが
  // あるかどうかを確認する(完全一致のみ。中身が違う同名ファイルを
  // 誤って拾わないようにするため)
  const modelKey = computeModelKey(file.name, file.lastModified);
  const existingState = loadSavedAppState(modelKey);

  if (existingState) {
    // 既に保存データがある場合は、新規/続きから再開をユーザーに選んでもらう
    resumeChoiceOverlay.style.display = 'flex';

    const onNew = () => {
      resumeChoiceOverlay.style.display = 'none';
      cleanup();
      // 「新規」を選んだ場合は、古い保存データを消してからまっさらに始める
      clearSavedAppState(modelKey);
      loadModelFile(file, modelKey, false);
    };
    const onResume = () => {
      resumeChoiceOverlay.style.display = 'none';
      cleanup();
      loadModelFile(file, modelKey, true);
    };
    function cleanup() {
      resumeChoiceNewBtn.removeEventListener('click', onNew);
      resumeChoiceResumeBtn.removeEventListener('click', onResume);
    }
    resumeChoiceNewBtn.addEventListener('click', onNew);
    resumeChoiceResumeBtn.addEventListener('click', onResume);
    return;
  }

  loadModelFile(file, modelKey, false);
});

  if (!item || !Array.isArray(item.state.commentPins) || item.state.commentPins.length === 0) {
    photoAssignList.textContent = '保存されたコメントがありません。ARでコメントを付けてから使ってください。';
    return;
  }
  item.state.commentPins.forEach((pinData) => {
    pinData.entries = normalizePinEntries(pinData);
    pinData.entries.forEach((entry) => {
      const card = document.createElement('div');
      card.className = 'pa-item';
      const text = document.createElement('div');
      text.className = 'pa-item-text';
      text.textContent = entry.text || '(文字なし)';
      card.appendChild(text);
      if (entry.image) {
        const img = document.createElement('img');
        img.src = entry.image;
        card.appendChild(img);
      }
      const lockedWithImage = entry.locked && entry.image;
      const btn = document.createElement('button');
      btn.textContent = lockedWithImage ? '🔒 ロック済み' : (entry.image ? '🖼 画像を変更' : '🖼 画像を追加');
      btn.disabled = Boolean(lockedWithImage);
      btn.addEventListener('click', () => {
        pinImageInput.value = '';
        pinImageInput.onchange = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          downscaleImageFile(file, 800).then((dataUrl) => {
            entry.image = dataUrl;
            try {
              localStorage.setItem(appStateStorageKeyFor(item.modelKey), JSON.stringify(item.state));
            } catch (err) {
              alert('保存に失敗しました(容量不足の可能性があります)');
            }
            renderPhotoAssignList();
          }).catch(() => {});
        };
        pinImageInput.click();
      });
      card.appendChild(btn);
      photoAssignList.appendChild(card);
    });
  });
}

// GLB/GLTFファイルを実際に読み込む共通処理。
// resumeがtrueの場合、保存済みの位置合わせ結果をそのまま使い、
// 位置決め(確定操作)を省略して通常のAR画面にそのまま入る。
function loadModelFile(file, modelKey, resume) {
  fileLabel.textContent = '読み込み中...';
  manualArStartBtn.style.display = 'none';

  currentModelKey = modelKey;
  skipPositionSettingOnPlace = resume;
  isResumedSession = resume;

  // 次回、セッションが切れた際に同じファイルを選び直さなくて済むよう、
  // 選択されたファイルの中身自体もキャッシュしておく
  cacheModelFile(currentModelKey, file);

  const objectUrl = URL.createObjectURL(file);
  loader.load(
    objectUrl,
    (gltf) => {
      onModelLoaded(gltf, file.name);
      URL.revokeObjectURL(objectUrl);
    },
    undefined,
    (error) => onModelLoadError(error)
  );
}

// モデル読み込み成功時の共通処理(単一ファイル・複数ファイルどちらの経路からも呼ばれる)
function onModelLoaded(gltf, fileName) {
  bimModel = gltf.scene;

  // まず、スケール変更前の生のサイズを測定する
  bimModel.updateMatrixWorld(true);
  const rawBox = new THREE.Box3().setFromObject(bimModel);
  const rawSize = new THREE.Vector3();
  rawBox.getSize(rawSize);
  const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);

  // 明らかに巨大(1000を超える)ならミリメートル単位とみなし1/1000に、
  // それ以外はメートル単位とみなしそのまま(1倍)にする
  const scaleFactor = maxDim > 1000 ? 0.001 : 1;
  bimModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
  fileLabel.textContent = `選択中: ${fileName}`;
  selectedFileName = fileName;

  // 面同士のなす角度が一定以上(=本当の稜線)の場所だけ、白い輪郭線を重ねる。
  // 平らな面の中の三角形分割線は無視されるので、広い面でも三角形が目立たない。
  // (bimModel.clone()で複製されるより前に付けておくことで、実際にARで
  //  表示されるmodelMesh側にも自動的に引き継がれる)
  addEdgeOutlines(bimModel);

  // 画面には出さないが、開発者ツールのコンソールで確認できるようにしておく
  console.log(
    `[スケール判定] raw size: (${rawSize.x.toFixed(2)}, ${rawSize.y.toFixed(2)}, ${rawSize.z.toFixed(2)}) → maxDim: ${maxDim.toFixed(2)} → scaleFactor: x${scaleFactor}`
  );

  // バウンディングボックスの中心(高さ含む)を自動で基準点にする
  bimModel.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(bimModel);
  box.getCenter(originOffset);

  // 通り芯ラベル(X1・X2・Y1・Y2等)があれば抽出しておく。
  // (GridLinesノードのextrasは、GLTFLoaderによって自動的にuserDataに反映される)
  gridLabelsData = [];
  gridLabelsContainer.innerHTML = '';
  gridLabelElements.length = 0;
  gridLineObject = null;
  bimModel.traverse((obj) => {
    if (obj.name === 'GridLines' && obj.userData && Array.isArray(obj.userData.gridLabels)) {
      obj.userData.gridLabels.forEach((label) => {
        gridLabelsData.push({
          tag: label.tag,
          position: new THREE.Vector3(label.position[0], label.position[1], label.position[2]),
        });
      });

      // 円柱メッシュへの置き換えを試みたところ、逆に「表示自体」が
      // 不安定になったため、最初に確実に表示できていた構成
      // (GLTFLoaderが直接作るLineSegmentsをそのまま使う)に戻した。
      // 太さ調整スライダーは廃止。ただしlinewidthだけ試しに太めの値を
      // 設定しておく(多くのブラウザでは無視される既知の制限があるが、
      // 表示自体は一切変更しないので安全)。
      gridLineObject = obj;
      gridLineObject.material.color.set(0xffffff);
      gridLineObject.material.linewidth = 3;
    }
  });

  // モデル内で使われている色を検出し、色別の透過チェックリストを作る
  buildColorGroups(bimModel);
  renderColorFilterList();

  // 読み込みが終わったら、続けて自動でARを開始する
  // (ファイル選択というユーザー操作の直後に呼ぶことで、ブラウザの
  //  「ユーザー操作がきっかけでないとARを開始できない」制約を満たす)
  startARSession();
}

function onModelLoadError(error) {
  console.error('BIMモデルの読み込みに失敗しました', error);
  fileLabel.textContent = '読み込み失敗。もう一度選択してください';
}

// BCF(BIM Collaboration Format)のGUIDを生成する(RFC4122簡易版で十分)
function generateGuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

// XML特殊文字をエスケープする
function escapeXml(str) {
  return String(str).replace(/[<>&'"]/g, (c) => ({
    '<': '&lt;',
    '>': '&gt;',
    '&': '&amp;',
    "'": '&apos;',
    '"': '&quot;',
  }[c]));
}

// AR上のワールド座標を、BIM本来の座標系(IFCのZ-up)に逆変換する。
// ①modelMeshのローカル座標に変換(AR配置による移動・回転・拡大の影響を除く)
// ②IFC→GLTF変換時に行った Z-up→Y-up 変換(x,y,z)→(x,z,-y) の逆変換 (x,y,z)→(x,-z,y) を適用
function worldToBimCoords(worldVec, isDirection) {
  const local = worldVec.clone();
  if (isDirection) {
    // 方向ベクトルは、平行移動の影響を受けないよう回転・拡縮のみを適用する
    const worldQuat = new THREE.Quaternion();
    modelMesh.getWorldQuaternion(worldQuat);
    local.applyQuaternion(worldQuat.invert());
  } else {
    modelMesh.worldToLocal(local);
  }
  // Y-up(glTF) -> Z-up(IFC)
  return new THREE.Vector3(local.x, -local.z, local.y);
}

// BCFのmarkup.bcf(トピック本体+コメント)のXMLを組み立てる
function buildMarkupXml({ topicGuid, commentGuid, viewpointGuid, text, isoDate, hasSnapshot }) {
  const safeText = escapeXml(text);
  const title = safeText.length > 40 ? safeText.slice(0, 40) + '…' : safeText;
  const snapshotAttr = hasSnapshot ? ' Snapshot="snapshot.png"' : '';
  return `<?xml version="1.0" encoding="UTF-8"?>
<Markup>
  <Topic Guid="${topicGuid}" TopicType="Comment" TopicStatus="Open">
    <Title>${title}</Title>
    <CreationDate>${isoDate}</CreationDate>
    <CreationAuthor>bim-ar-viewer</CreationAuthor>
  </Topic>
  <Comment Guid="${commentGuid}">
    <Date>${isoDate}</Date>
    <Author>bim-ar-viewer</Author>
    <Comment>${safeText}</Comment>
    <Viewpoint Guid="${viewpointGuid}"/>
  </Comment>
  <Viewpoints Guid="${viewpointGuid}" Viewpoint="viewpoint.bcfv"${snapshotAttr}/>
</Markup>`;
}

// BCFのviewpoint.bcfv(視点情報)のXMLを組み立てる。
// 現時点ではIFC部材(GUID)との紐付け(<Components>)は行わず、視点情報のみ。
// (将来、タップした部材のIFC GUIDを特定できるようになれば、ここに<Components>を追加できる)
function buildViewpointXml({ viewpointGuid, position, direction, up }) {
  return `<?xml version="1.0" encoding="UTF-8"?>
<VisualizationInfo Guid="${viewpointGuid}">
  <PerspectiveCamera>
    <CameraViewPoint>
      <X>${position.x}</X>
      <Y>${position.y}</Y>
      <Z>${position.z}</Z>
    </CameraViewPoint>
    <CameraDirection>
      <X>${direction.x}</X>
      <Y>${direction.y}</Y>
      <Z>${direction.z}</Z>
    </CameraDirection>
    <CameraUpVector>
      <X>${up.x}</X>
      <Y>${up.y}</Y>
      <Z>${up.z}</Z>
    </CameraUpVector>
    <FieldOfView>60</FieldOfView>
  </PerspectiveCamera>
</VisualizationInfo>`;
}

const BCF_VERSION_XML = `<?xml version="1.0" encoding="UTF-8"?>
<Version VersionId="2.1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="version.xsd">
  <DetailedVersion>2.1</DetailedVersion>
</Version>`;

// ボタンのテキストを一時的に変えて、簡易的な通知として使う
// (window.alert()等のネイティブダイアログはAR中にセッションを終了させる恐れがあるため使わない)
function flashButtonMessage(button, message, durationMs) {
  const original = button.textContent;
  button.textContent = message;
  setTimeout(() => {
    button.textContent = original;
  }, durationMs);
}

// 全コメントピンを、BCF(.bcfzip)ファイルとして書き出す
async function exportBCF() {
  if (commentPins.length === 0) {
    flashButtonMessage(saveRecordButton, '⚠ コメントがありません', 2000);
    return;
  }
  if (typeof JSZip === 'undefined') {
    flashButtonMessage(saveRecordButton, '⚠ ZIP機能の読込に失敗', 2000);
    return;
  }

  const zip = new JSZip();
  zip.file('bcf.version', BCF_VERSION_XML);

  commentPins.forEach((pin) => {
    const topicGuid = generateGuid();
    const commentGuid = generateGuid();
    const viewpointGuid = generateGuid();
    const folder = zip.folder(topicGuid);

    const entries = normalizePinEntries(pin);
    // 複数entryを、日時付きで1つのBCFコメント本文にまとめる
    // (BCF側の複数コメント対応は将来の課題とし、今回はまとめて1件にする)
    const combinedText = entries
      .map((e) => `[${formatEntryDate(e.createdAt)}]\n${e.text}`)
      .join('\n\n');
    const firstCreatedAt = entries[0] ? entries[0].createdAt : new Date().toISOString();
    const imageEntry = [...entries].reverse().find((e) => e.image);

    const bimPosition = worldToBimCoords(pin.cameraPosition, false);
    const bimDirection = worldToBimCoords(pin.cameraDirection, true).normalize();
    const bimUp = worldToBimCoords(pin.cameraUp, true).normalize();

    folder.file(
      'markup.bcf',
      buildMarkupXml({
        topicGuid,
        commentGuid,
        viewpointGuid,
        text: combinedText,
        isoDate: firstCreatedAt,
        hasSnapshot: Boolean(imageEntry),
      })
    );
    folder.file(
      'viewpoint.bcfv',
      buildViewpointXml({
        viewpointGuid,
        position: bimPosition,
        direction: bimDirection,
        up: bimUp,
      })
    );
    if (imageEntry) {
      const base64Data = imageEntry.image.split(',')[1];
      folder.file('snapshot.png', base64Data, { base64: true });
    }
  });

  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  a.href = url;
  a.download = `bim-ar-comments_${timestamp}.bcfzip`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

saveRecordButton.addEventListener('click', () => {

// コメント一括表示ONの間、毎フレーム呼ばれる。
// 各ピンのワールド座標を画面上の2D座標に投影し、その位置にラベルを配置する。
// 確認ビュー中、吹き出しをドラッグで動かす(ドラッグせずに離したらコメントを開く)
function attachLabelDrag(label, pin) {
  let startX = 0, startY = 0, moved = false, dragging = false;
  label.addEventListener('pointerdown', (e) => {
    if (!confirmViewActive) return;
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    label.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  label.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    moved = true;
    const off = pin.labelOffset || { x: 0, y: -60 };
    pin.labelOffset = { x: off.x + (e.clientX - startX), y: off.y + (e.clientY - startY) };
    startX = e.clientX; startY = e.clientY;
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (moved) saveAppState();
    else showPinThreadView(pin);
  };
  label.addEventListener('pointerup', end);
  label.addEventListener('pointercancel', () => { dragging = false; });
}

function updateCommentLabels() {
  if (!commentLabelsVisible || !placedModel) return;
  // 現在地・コメント確認中は、BIM専用ビューのカメラで投影する
  const projCamera = (confirmViewActive && pointAlignCamera) ? pointAlignCamera : camera;

  const halfWidth = window.innerWidth / 2;
  const halfHeight = window.innerHeight / 2;
  const tempVec = new THREE.Vector3();

  commentPins.forEach((pin) => {
    let label = pinLabelElements.get(pin);
    if (!label) {
      label = document.createElement('div');
      label.className = 'comment-label';
      label.style.touchAction = 'none';
      attachLabelDrag(label, pin);
      const textSpan = document.createElement('div');
      textSpan.className = 'comment-label-text';
      label.appendChild(textSpan);
      commentLabelsContainer.appendChild(label);
      pinLabelElements.set(pin, label);
    }
    const textSpan = label.querySelector('.comment-label-text');
    const entries = normalizePinEntries(pin);
    const latest = entries[entries.length - 1];
    textSpan.textContent = entries.length > 1
      ? `${latest.text}(${entries.length}件)`
      : (latest ? latest.text : '');

    pin.mesh.getWorldPosition(tempVec);
    tempVec.project(projCamera);
    label.style.pointerEvents = confirmViewActive ? 'auto' : 'none';

    let line = cvLeaderLines.get(pin);
    if (tempVec.z > 1 || tempVec.z < -1) {
      // カメラの視錐台の外(背後含む)にあるので非表示
      label.style.display = 'none';
      if (line) line.style.display = 'none';
      return;
    }
    label.style.display = 'block';
    const px = tempVec.x * halfWidth + halfWidth;
    const py = -tempVec.y * halfHeight + halfHeight;
    if (confirmViewActive) {
      // 現在地・コメント確認中: 吹き出しをずらして置き、ピンへ引き出し線を引く
      const off = pin.labelOffset || { x: 0, y: -60 };
      label.style.left = `${px + off.x}px`;
      label.style.top = `${py + off.y}px`;
      if (!line) {
        line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('stroke', '#ffeb3b');
        line.setAttribute('stroke-width', '2');
        line.setAttribute('stroke-dasharray', '6,5');
        cvLeaderSvg.appendChild(line);
        cvLeaderLines.set(pin, line);
      }
      line.style.display = '';
      line.setAttribute('x1', px);
      line.setAttribute('y1', py);
      line.setAttribute('x2', px + off.x);
      line.setAttribute('y2', py + off.y);
    } else {
      label.style.left = `${px}px`;
      label.style.top = `${py}px`;
      if (line) line.style.display = 'none';
    }
  });

  // 削除済みピンに対応するラベルが残っていれば掃除する
  pinLabelElements.forEach((el, pin) => {
    if (!commentPins.includes(pin)) {
      el.remove();
      pinLabelElements.delete(pin);
    }
  });
}

// ---- セッション断絶(キーボード・画像選択でARが強制終了する不具合)対策 ----
// モデルの位置合わせ結果とコメントピン(画像込み)をブラウザのlocalStorageに保存し、
// ページが再読み込みされた後、同じファイルを選び直すだけで自動的に復元できるようにする。
// (現実の空間に対する「位置合わせ」自体はセッションをまたいで復元できないため、
//  そこだけは毎回やり直しが必要。ただしコメントピンは失われずに済む)
// キーはモデルごと(ファイル名+更新日時)に分かれているため、複数のモデルを
// 切り替えても、互いのコメントが上書きされて消えることはない。
const APP_STATE_STORAGE_KEY_PREFIX = 'bimArViewerAppState::';

function appStateStorageKeyFor(modelKey) {
  return APP_STATE_STORAGE_KEY_PREFIX + modelKey;
}

// ファイルをbase64のdata URLに変換する
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 中間ファイル(JSON)をダウンロードフォルダに保存する。
// モデル本体(キャッシュ済みのGLB/GLTF)もbase64で埋め込むため、
// 別端末に渡す際、このJSON1つだけで完結する(モデルファイルを
// 別途選び直す必要がない)。
// 同名ファイルがあればブラウザが自動的に別名(「(1)」等)で保存するため、
// 上書きの心配はない。古くなったファイルは、ユーザー自身が
// ダウンロードフォルダから削除・整理する運用とする。
async function downloadIntermediateFile(state) {
  try {
    const stateToSave = { ...state };
    const modelKey = state.modelKey;
    if (modelKey) {
      const cachedFile = await loadCachedModelFile(modelKey);
      if (cachedFile) {
        stateToSave.modelFileBase64 = await fileToBase64(cachedFile);
      }
    }

    const blob = new Blob([JSON.stringify(stateToSave)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const baseName = (state.fileName || 'model').replace(/\.[^.]+$/, '');
    a.href = url;
    a.download = `${baseName}_JSONファイル.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error('中間ファイルの自動保存に失敗しました', err);
  }
}

function saveAppState() {
  if (!placedModel || !currentModelKey) return;
  try {
    const colorFilters = {};
    colorGroups.forEach((group, hex) => {
      colorFilters[hex] = group.enabled;
    });

    const pins = commentPins.map((pin) => ({
      localPosition: { x: pin.mesh.position.x, y: pin.mesh.position.y, z: pin.mesh.position.z },
      labelOffset: pin.labelOffset || null,
      entries: normalizePinEntries(pin),
      cameraPosition: { x: pin.cameraPosition.x, y: pin.cameraPosition.y, z: pin.cameraPosition.z },
      cameraDirection: { x: pin.cameraDirection.x, y: pin.cameraDirection.y, z: pin.cameraDirection.z },
      cameraUp: { x: pin.cameraUp.x, y: pin.cameraUp.y, z: pin.cameraUp.z },
    }));

    const state = {
      modelKey: currentModelKey,
      fileName: selectedFileName,
      position: { x: placedModel.position.x, y: placedModel.position.y, z: placedModel.position.z },
      quaternion: {
        x: placedModel.quaternion.x,
        y: placedModel.quaternion.y,
        z: placedModel.quaternion.z,
        w: placedModel.quaternion.w,
      },
      scale: currentScale,
      opacity: currentOpacity,
      colorFilters,
      commentPins: pins,
      // ピンの位置(localPosition)はplacedModel基準で保存されている。
      // BIMアプリ側で素のモデル(bimModelの座標系)にピンを置き直す際、
      // localPosition + originOffset が本来の(モデル自身の)座標になる。
      originOffset: { x: originOffset.x, y: originOffset.y, z: originOffset.z },
      alignRef: alignRef ? {
        cornerLocal: { x: alignRef.cornerLocal.x, y: alignRef.cornerLocal.y, z: alignRef.cornerLocal.z },
        edgeOtherLocal: { x: alignRef.edgeOtherLocal.x, y: alignRef.edgeOtherLocal.y, z: alignRef.edgeOtherLocal.z },
      } : null,
      savedAt: new Date().toISOString(),
    };

    localStorage.setItem(appStateStorageKeyFor(currentModelKey), JSON.stringify(state));
    // 中間ファイルのダウンロードは、ここでは行わない(コメント追加のたびに
    // 出るとブロック通知が頻発するため)。「🌐 全体確認」ボタンを押した
    // タイミングでのみダウンロードする。
  } catch (err) {
    console.error('状態の保存に失敗しました', err);
  }
}

function loadSavedAppState(modelKey) {
  try {
    const raw = localStorage.getItem(appStateStorageKeyFor(modelKey));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    console.error('保存データの読み込みに失敗しました', err);
    return null;
  }
}

function clearSavedAppState(modelKey) {
  try {
    localStorage.removeItem(appStateStorageKeyFor(modelKey));
  } catch (err) {
    // 何もしない
  }
}

// 保存されている全モデル分の状態を一覧取得する(初期画面の一覧表示用)
function listAllSavedAppStates() {
  const results = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(APP_STATE_STORAGE_KEY_PREFIX)) continue;
    const modelKey = key.slice(APP_STATE_STORAGE_KEY_PREFIX.length);
    try {
      const state = JSON.parse(localStorage.getItem(key));
      results.push({ modelKey, state });
    } catch (err) {
      // 壊れたデータはスキップ
    }
  }
  // 更新日時が新しい順
  results.sort((a, b) => (a.state.savedAt < b.state.savedAt ? 1 : -1));
  return results;
}

// 保存されていた状態(位置・向き・拡大率・コメントピン)を配置済みモデルに適用する
function applySavedAppState(state) {
  if (!placedModel || !state) return;

  alignRef = null;
  if (state.alignRef && state.alignRef.cornerLocal && state.alignRef.edgeOtherLocal) {
    const c = state.alignRef.cornerLocal, e = state.alignRef.edgeOtherLocal;
    alignRef = {
      cornerLocal: new THREE.Vector3(c.x, c.y, c.z),
      edgeOtherLocal: new THREE.Vector3(e.x, e.y, e.z),
    };
  }
  placedModel.position.set(state.position.x, state.position.y, state.position.z);
  placedModel.quaternion.set(
    state.quaternion.x,
    state.quaternion.y,
    state.quaternion.z,
    state.quaternion.w
  );

  if (typeof state.scale === 'number') {
    currentScale = state.scale;
    placedModel.scale.setScalar(currentScale);
  }
  if (typeof state.opacity === 'number') {
    currentOpacity = state.opacity;
    const opacityPercent = Math.round(currentOpacity * 100);
    opacitySlider.value = opacityPercent;
    opacityValueLabel.textContent = `${opacityPercent}%`;
  }
  if (state.colorFilters) {
    Object.entries(state.colorFilters).forEach(([hex, enabled]) => {
      const group = colorGroups.get(hex);
      if (group) {
        group.enabled = enabled;
        group.materials.forEach((mat) => {
          mat.userData.transparencyExcluded = !enabled;
        });
      }
    });
    renderColorFilterList();
  }
  applyOpacity(placedModel, currentOpacity);

  if (Array.isArray(state.commentPins)) {
    state.commentPins.forEach((pinData) => {
      const pinMesh = createPinMesh();
      pinMesh.position.set(pinData.localPosition.x, pinData.localPosition.y, pinData.localPosition.z);
      placedModel.add(pinMesh);
      commentPins.push({
        mesh: pinMesh,
        entries: normalizePinEntries(pinData),
        labelOffset: pinData.labelOffset || null,
        cameraPosition: new THREE.Vector3(
          pinData.cameraPosition.x,
          pinData.cameraPosition.y,
          pinData.cameraPosition.z
        ),
        cameraDirection: new THREE.Vector3(
          pinData.cameraDirection.x,
          pinData.cameraDirection.y,
          pinData.cameraDirection.z
        ),
        cameraUp: new THREE.Vector3(pinData.cameraUp.x, pinData.cameraUp.y, pinData.cameraUp.z),
      });
    });
  }
}

// BIMモデル(と通り芯ラベル)を表示するか。「AR」がOFFでも、位置合わせ中・現在地確認中は表示する
function isArModelShown() {
  return arModelVisible || confirmViewActive || pointAlignStep === 1 || orientationAlignStep > 0 || positionSettingActive;
}

function updateGridLabels() {
  if (!placedModel || !modelMesh || gridLabelsData.length === 0 || !gridLabelsVisible) return;
  if (!isArModelShown()) {
    gridLabelElements.forEach((el) => { if (el) el.style.display = 'none'; });
    return;
  }
  const projCamera = (confirmViewActive && pointAlignCamera) ? pointAlignCamera : camera;

  const halfWidth = window.innerWidth / 2;
  const halfHeight = window.innerHeight / 2;
  const tempVec = new THREE.Vector3();

  gridLabelsData.forEach((label, i) => {
    let el = gridLabelElements[i];
    if (!el) {
      el = document.createElement('div');
      el.className = 'grid-label';
      el.textContent = label.tag;
      gridLabelsContainer.appendChild(el);
      gridLabelElements[i] = el;
    }

    tempVec.copy(label.position);
    modelMesh.localToWorld(tempVec);
    tempVec.project(projCamera);

    if (tempVec.z > 1 || tempVec.z < -1) {
      el.style.display = 'none';
      return;
    }
    el.style.display = 'flex';
    el.style.left = `${tempVec.x * halfWidth + halfWidth}px`;
    el.style.top = `${-tempVec.y * halfHeight + halfHeight}px`;
  });
}

// 新しいコメントピン(小さな球)を作成し、placedModelの子として追加する。
// 子として追加することで、モデルの移動・回転・拡大縮小に自動で追従する。
function createPinMesh() {
  const pinGeometry = new THREE.SphereGeometry(0.025, 12, 12);
  const pinMaterial = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
  const pinMesh = new THREE.Mesh(pinGeometry, pinMaterial);
  pinMesh.userData.isCommentPin = true;
  return pinMesh;
}

function addCommentPin(worldPoint, text, imageDataUrl) {
  placedModel.updateMatrixWorld(true);
  const pinMesh = createPinMesh();
  pinMesh.position.copy(placedModel.worldToLocal(worldPoint.clone()));
  placedModel.add(pinMesh);

  // BCF出力用に、コメント作成時点のカメラ視点(ワールド座標)を記録しておく。
  // (後で書き出すときではなく、タップした「その瞬間」の視点を残すため)
  const cameraPosition = new THREE.Vector3();
  camera.getWorldPosition(cameraPosition);
  const cameraDirection = new THREE.Vector3();
  camera.getWorldDirection(cameraDirection);
  const cameraWorldQuat = new THREE.Quaternion();
  camera.getWorldQuaternion(cameraWorldQuat);
  const cameraUp = camera.up.clone().applyQuaternion(cameraWorldQuat);

  // 注: 以前はここでrenderer.domElement.toDataURL()によるスクリーンショット取得も
  // 行っていたが、AR(WebXR)セッション中にこれを呼ぶと機種によってはセッションが
  // 不安定になり、コメント確定と同時に初期画面へ戻ってしまう不具合が起きたため削除した。
  // (window.prompt()と同様、AR中のcanvas読み取り系の処理は要注意)
  // 代わりに、スマホの標準スクショ機能で撮った画像を、ユーザーが手動で選んで
  // 添付する形にしている(image引数、任意)。

  commentPins.push({
    mesh: pinMesh,
    entries: [{
      createdAt: new Date().toISOString(),
      text,
      image: imageDataUrl || null,
      locked: false,
    }],
    cameraPosition,
    cameraDirection,
    cameraUp,
  });
}

// 音声でコメントを取得する。キーボードは一切使わない
// (AR中にソフトウェアキーボードを開閉すると、この端末ではWebXRセッションが
// 終了してしまう不具合が確認されたため、テキスト入力欄を使わない設計にしている)。
// 戻り値: 確定した文字列、またはキャンセル時null
function captureVoiceComment() {
  return new Promise((resolve) => {
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognitionCtor) {
      // 音声認識に非対応の環境向けの最終手段。
      // 注意: これはキーボードを使うため、AR中は前述の不具合が起きる可能性がある。
      const text = window.prompt('この端末は音声入力に対応していません。コメントを入力してください', '');
      resolve(text && text.trim() ? text : null);
      return;
    }

    voiceModalStatus.textContent = '🎤 話してください…';
    voiceModalTranscript.textContent = '';
    voiceModalOkBtn.style.display = 'none';
    voiceModalRetryBtn.style.display = 'none';
    voiceModalOverlay.style.display = 'flex';

    let finalText = '';
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcript;
        } else {
          interim += transcript;
        }
      }
      voiceModalTranscript.textContent = finalText + interim;
    };

    recognition.onerror = (event) => {
      voiceModalStatus.textContent = `⚠ 音声認識エラー: ${event.error}(もう一度お試しください)`;
      voiceModalRetryBtn.style.display = 'inline-block';
    };

    recognition.onend = () => {
      voiceModalStatus.textContent = finalText ? '認識結果:' : '(認識できませんでした)';
      voiceModalOkBtn.style.display = 'inline-block';
      voiceModalRetryBtn.style.display = 'inline-block';
    };

    function cleanup() {
      voiceModalOverlay.style.display = 'none';
      voiceModalOkBtn.removeEventListener('click', onOk);
      voiceModalRetryBtn.removeEventListener('click', onRetry);
      voiceModalCancelBtn.removeEventListener('click', onCancel);
    }
    function onOk() {
      cleanup();
      resolve(finalText.trim() || null);
    }
    function onRetry() {
      finalText = '';
      voiceModalTranscript.textContent = '';
      voiceModalStatus.textContent = '🎤 話してください…';
      voiceModalOkBtn.style.display = 'none';
      voiceModalRetryBtn.style.display = 'none';
      try {
        recognition.start();
      } catch (err) {
        voiceModalStatus.textContent = '⚠ 音声認識を開始できませんでした';
      }
    }
    function onCancel() {
      try {
        recognition.abort();
      } catch (err) {
        // 何もしない
      }
      cleanup();
      resolve(null);
    }

    voiceModalOkBtn.addEventListener('click', onOk);
    voiceModalRetryBtn.addEventListener('click', onRetry);
    voiceModalCancelBtn.addEventListener('click', onCancel);

    try {
      recognition.start();
    } catch (err) {
      voiceModalStatus.textContent = '⚠ 音声認識を開始できませんでした';
      voiceModalRetryBtn.style.display = 'inline-block';
    }
  });
}

// キーボードでコメントを取得する。
// 注意: AR中にソフトウェアキーボードを開閉すると、この端末ではWebXRセッションが
// 終了することが確認済み。これはブラウザの仕様上避けられないため、代わりに
// セッションが切れても状態を復元できる仕組み(saveAppState/loadSavedAppState)を
// 別途用意している。
// 戻り値: 確定した文字列、またはnull(キャンセル/空欄)
function captureKeyboardComment(initialValue) {
  return new Promise((resolve) => {
    keyboardModalInput.value = initialValue || '';
    keyboardModalOverlay.style.display = 'flex';
    keyboardModalInput.focus();

    function cleanup() {
      keyboardModalOverlay.style.display = 'none';
      keyboardModalOkBtn.removeEventListener('click', onOk);
      keyboardModalCancelBtn.removeEventListener('click', onCancel);
    }
    function onOk() {
      const value = keyboardModalInput.value.trim();
      cleanup();
      resolve(value || null);
    }
    function onCancel() {
      cleanup();
      resolve(null);
    }
    keyboardModalOkBtn.addEventListener('click', onOk);
    keyboardModalCancelBtn.addEventListener('click', onCancel);
  });
}

// コメント保存後、画像(スマホのスクショ等)を任意で添付するか尋ねる。
// 「画像を選択」を押すとOS標準の画像選択(カメラ/カメラロール)が開く。
// 注意: これはキーボードと同種のOSネイティブUIのため、AR中に開くと
// セッションが不安定になる可能性がある(未検証)。
// 戻り値: 選択した画像のdata URL、またはnull(スキップ/未選択)
function askAttachImage() {
  return new Promise((resolve) => {
    imageAttachOverlay.style.display = 'flex';

    function cleanup() {
      imageAttachOverlay.style.display = 'none';
      imageAttachSkipBtn.removeEventListener('click', onSkip);
      imageAttachChooseBtn.removeEventListener('click', onChoose);
    }
    function onSkip() {
      cleanup();
      resolve(null);
    }
    function onChoose() {
      cleanup();
      pinImageInput.value = ''; // 同じ画像を続けて選び直せるようリセットしておく
      pinImageInput.onchange = (event) => {
        const file = event.target.files[0];
        if (!file) {
          resolve(null);
          return;
        }
        // 元ファイルをそのままbase64化すると、スマホのカメラ写真は
        // 数MBになることがあり変換に時間がかかる。セッションが切れるまでの
        // 短い時間内に確実に完了させるため、縮小・軽量化してから使う。
        downscaleImageFile(file, 800)
          .then(resolve)
          .catch(() => resolve(null));
      };
      pinImageInput.click();
    }
    imageAttachSkipBtn.addEventListener('click', onSkip);
    imageAttachChooseBtn.addEventListener('click', onChoose);
  });
}

// 画像を指定した最大幅に縮小し、軽量なJPEGのdata URLとして返す。
// FileReaderで元ファイル全体をbase64化するより高速(小さいデータしか
// 扱わないため)。
function downscaleImageFile(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(objectUrl);
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = (err) => {
      URL.revokeObjectURL(objectUrl);
      reject(err);
    };
    img.src = objectUrl;
  });
}

// コメントentryの表示色(交互に使い、書いた人・タイミングが変わったことを見分けやすくする)
const COMMENT_ENTRY_COLORS = ['#42a5f5', '#ffa726', '#66bb6a', '#ab47bc', '#ef5350', '#26c6da'];

// 古い形式(text/imageを1つだけ持つ)のピンデータを、entries配列形式に変換する。
// 既にentries形式ならそのまま返す(locked未設定はfalse扱いにする)。
function normalizePinEntries(pinData) {
  if (Array.isArray(pinData.entries)) {
    return pinData.entries.map((e) => ({ ...e, locked: e.locked === true }));
  }
  return [{
    createdAt: pinData.createdAt || new Date().toISOString(),
    text: pinData.text || '',
    image: pinData.image || null,
    locked: false,
  }];
}

function formatEntryDate(iso) {
  try {
    return new Date(iso).toLocaleString('ja-JP', {
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    });
  } catch (err) {
    return '';
  }
}

// entries配列を、色分けされたカードとしてcontainer内に描画する(閲覧専用)。
// textContentのみ使い、innerHTMLでの文字列組み立ては行わない(安全のため)。
function renderEntriesInto(container, entries, onAddImage) {
  container.innerHTML = '';
  entries.forEach((entry, i) => {
    const card = document.createElement('div');
    card.className = 'comment-entry-card';
    card.style.borderLeftColor = COMMENT_ENTRY_COLORS[i % COMMENT_ENTRY_COLORS.length];

    const meta = document.createElement('div');
    meta.className = 'comment-entry-meta';
    meta.textContent = formatEntryDate(entry.createdAt);
    card.appendChild(meta);

    const body = document.createElement('div');
    body.className = 'comment-entry-body';
    body.textContent = entry.text || '';
    card.appendChild(body);

    if (entry.image) {
      const img = document.createElement('img');
      img.className = 'comment-entry-image';
      img.src = entry.image;
      card.appendChild(img);
    }
    // 写真の追加・変更ができる(ロック済みのコメントは、写真が未添付の場合だけ追加可)
    if (onAddImage && (!entry.locked || !entry.image)) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = entry.image ? '🖼 画像を変更' : '🖼 画像を追加';
      btn.style.cssText = 'margin-top:6px;padding:6px 10px;border:none;border-radius:6px;background:#6a1b9a;color:#fff;font-size:12px;';
      btn.addEventListener('click', () => onAddImage(i));
      card.appendChild(btn);
    }
    container.appendChild(card);
  });
}

// 既存ピンをタップした時の、コメントスレッド閲覧。現場で作ったコメントには写真を追加・変更できる
// (JSONから取り込んだ分はロックされていて閲覧のみ。テキストの追記・編集・削除はBIM表示アプリ側で行う)
function showPinThreadView(pin) {
  pin.entries = normalizePinEntries(pin);
  const render = () => {
    renderEntriesInto(pinActionText, pin.entries, (index) => {
      pinImageInput.value = '';
      pinImageInput.onchange = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        downscaleImageFile(file, 800).then((dataUrl) => {
          pin.entries[index].image = dataUrl;
          saveAppState();
          render();
          notifyPhotoAttached();
        }).catch(() => {});
      };
      photoPickPending = true;
      pinImageInput.click();
    });
  };
  render();
  pinActionOverlay.style.display = 'flex';
}
pinActionCloseBtn.addEventListener('click', () => {
  pinActionOverlay.style.display = 'none';
});


// 対象のオブジェクト(またはその親)が、コメント配置のレイキャストから除外すべき
// もの(通り芯、または輪郭線)かどうかを判定する。
function isGridLineObject(object) {
  let node = object;
  while (node) {
    if (node.userData && (node.userData.isGridLineTube || node.userData.isEdgeOutline)) return true;
    if (node.name === 'GridLines') return true;
    node = node.parent;
  }
  return false;
}

// 白い輪郭線を、線分ごとにその線に垂直な方向へ少しずらして複製することで、
// 実質1pxの制約(linewidthがブラウザに無視される問題)を受けずに、
// 疑似的に太く見せる。Fat Lines(LineSegments2)・チューブ(円柱メッシュ)は
// どちらも不具合(スマホでのフリーズ、重なった箇所が目立ちすぎる)が
// あったため、最も枯れた「同じ線を少しずらして重ねる」方式にした。
// (isMeshにならない普通のLineSegmentsのままなので、他の「メッシュだけを
//  対象にする」処理に紛れ込む心配もない)
const EDGE_OUTLINE_THICKEN_OFFSET = 0.01;

function thickenLineSegments(lineSegmentsObject, offset = EDGE_OUTLINE_THICKEN_OFFSET) {
  const posAttr = lineSegmentsObject.geometry.attributes.position;
  const segmentCount = posAttr.count / 2;

  const p1 = new THREE.Vector3();
  const p2 = new THREE.Vector3();
  const dir = new THREE.Vector3();
  const perp1 = new THREE.Vector3();
  const perp2 = new THREE.Vector3();
  const referenceUp = new THREE.Vector3(0, 1, 0);
  const referenceSide = new THREE.Vector3(1, 0, 0);

  const positions = [];

  for (let i = 0; i < segmentCount; i++) {
    p1.fromBufferAttribute(posAttr, i * 2);
    p2.fromBufferAttribute(posAttr, i * 2 + 1);
    dir.subVectors(p2, p1);
    if (dir.lengthSq() < 1e-12) continue;
    dir.normalize();

    // 線の向きとほぼ平行な基準ベクトルだと外積が破綻するので、
    // 線の向きに応じて安全な方の基準ベクトルを選ぶ(円弧を近似する
    // 細かい線分1本1本についても、線分ごとに個別に計算しているので、
    // 向きに関わらず正しく処理できる)
    const reference = Math.abs(dir.dot(referenceUp)) > 0.9 ? referenceSide : referenceUp;
    perp1.crossVectors(dir, reference).normalize();
    perp2.crossVectors(dir, perp1).normalize();

    [perp1, perp2].forEach((perp) => {
      [1, -1].forEach((sign) => {
        positions.push(
          p1.x + perp.x * offset * sign, p1.y + perp.y * offset * sign, p1.z + perp.z * offset * sign,
          p2.x + perp.x * offset * sign, p2.y + perp.y * offset * sign, p2.z + perp.z * offset * sign
        );
      });
    });
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  // 同じマテリアルを使い回すことで、色・表示状態の変更がそのまま反映される
  const thickened = new THREE.LineSegments(geometry, lineSegmentsObject.material);
  thickened.userData.isEdgeOutline = true;
  // 子として追加することで、表示/非表示の切り替え(親のvisible)を
  // そのまま引き継がせる
  lineSegmentsObject.add(thickened);
  return thickened;
}

// モデル内の各メッシュに、面同士のなす角度が一定以上(=本当の稜線)の場所だけ
// 白い輪郭線を重ねる。平らな面の中の三角形分割線は無視される。
// 通り芯(細い線材)には輪郭線をつけても意味が無いので除外する。
function addEdgeOutlines(root, thresholdAngleDeg = 15) {
  const targets = [];
  root.traverse((obj) => {
    if (obj.isMesh && obj.geometry && !isGridLineObject(obj)) {
      targets.push(obj);
    }
  });

  targets.forEach((mesh) => {
    // 輪郭線とメッシュ面のz-fightingを防ぐため、メッシュ側を少し奥に押しやる
    const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    materials.forEach((mat) => {
      if (!mat) return;
      mat.polygonOffset = true;
      mat.polygonOffsetFactor = 1;
      mat.polygonOffsetUnits = 1;
    });

    const edgesGeometry = new THREE.EdgesGeometry(mesh.geometry, thresholdAngleDeg);
    const edgesMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
    const edgeLines = new THREE.LineSegments(edgesGeometry, edgesMaterial);
    // 「メッシュだけを対象にする」他の処理から必ず除外するためのフラグ
    // (コメント配置のレイキャスト、透過設定、色フィルター、位置決め
    //  プレビュー生成など、複数箇所でこのフラグを見て除外している)
    edgeLines.userData.isEdgeOutline = true;
    // 透過(半透明)になっているメッシュにだけ輪郭を見せたいので、
    // 初期状態(不透明)では隠しておき、applyOpacity側で透過中だけ表示する
    edgeLines.visible = false;
    // メッシュの子として追加することで、メッシュ自身の位置・回転・拡大率
    // (=すでに正しく配置されている変換)をそのまま引き継がせる
    mesh.add(edgeLines);
    mesh.userData.edgeOutline = edgeLines;

    // 元の線に加えて、垂直方向に少しずらした4本を重ねて太く見せる
    thickenLineSegments(edgeLines);
  });
}

// コメント追加モード中はタップで新規追加・編集・削除ができ、
// モードOFF中でも、既存ピンをタップすればコメントの閲覧だけはできる。
// (renderer生成後でないとdomElementが存在しないため、init()内から呼び出す)
// タップ位置からモデル表面(既存ピン・通り芯以外)への交点を計算する
function raycastModelPoint(clientX, clientY) {
  const ndc = new THREE.Vector2(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(placedModel, true);
  const hit = hits.find((h) => !h.object.userData.isCommentPin && !isGridLineObject(h.object));
  return hit ? hit.point : null;
}

let pendingPinPreview = null; // ドラッグ調整中の仮ピン(まだcommentPinsには入れない)
let isDraggingNewPin = false;

// タップした指でピンが隠れないよう、少し上にずらした位置を「ピンの正解座標」
// として保存する。3D空間で単純に上へずらすと、面の向きによってはメッシュから
// 浮いて見えてしまうため、代わりに画面上で少し上の位置に対して再度レイキャスト
// し、そこでヒットした地点(=必ずメッシュ上の点)を使う。
const PIN_SCREEN_OFFSET_PX = 60;

// タップ位置と、そこから画面上で少し上の位置の両方でレイキャストし、
// 上側でもヒットしていればそちらを「ピンの正解座標」として採用する。
function raycastPinPoint(clientX, clientY) {
  const basePoint = raycastModelPoint(clientX, clientY);
  if (!basePoint) return null;
  const shiftedPoint = raycastModelPoint(clientX, clientY - PIN_SCREEN_OFFSET_PX);
  return shiftedPoint || basePoint;
}

function setupCommentPinInteraction() {
  renderer.domElement.addEventListener('pointerdown', (event) => {
    if (!placedModel) return;

    // 「2点合わせ」「点で合わせる」モード中は、通常のピン配置とは
    // 別処理に回す(専用の確定ボタンを使うため。「点で合わせる」中は
    // BIM専用ビュー(step1)か、AR画面へのタップを無視するstep2のどちらか)
    if (orientationAlignStep > 0) return;
    if (pointAlignStep > 0) return;

    const ndc = new THREE.Vector2(
      (event.clientX / window.innerWidth) * 2 - 1,
      -(event.clientY / window.innerHeight) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);

    // 既存ピンをタップした場合は、コメントスレッドを閲覧専用で開く
    // (追記・編集・削除はBIM表示アプリ側で行う運用のため、ここでは表示のみ)
    const pinMeshes = commentPins.map((p) => p.mesh);
    const pinHits = pinMeshes.length > 0 ? raycaster.intersectObjects(pinMeshes, true) : [];
    if (pinHits.length > 0) {
      const hitPin = commentPins.find((p) => p.mesh === pinHits[0].object);
      if (hitPin) showPinThreadView(hitPin);
      return;
    }

    // ここから先(新規ピン追加)は、コメント追加モードON中のみ有効
    if (!commentModeActive) return;

    const point = raycastPinPoint(event.clientX, event.clientY);
    if (!point) return;

    // タップした瞬間は確定せず、指を離すまでスライドして位置調整できる
    // 仮ピンを表示する(タップ精度のズレを、その場で微調整できるようにするため)
    pendingPinPreview = createPinMesh();
    pendingPinPreview.position.copy(placedModel.worldToLocal(point.clone()));
    placedModel.add(pendingPinPreview);
    isDraggingNewPin = true;
  });

  renderer.domElement.addEventListener('pointermove', (event) => {
    if (!isDraggingNewPin || !pendingPinPreview || !placedModel) return;
    const point = raycastPinPoint(event.clientX, event.clientY);
    if (point) {
      pendingPinPreview.position.copy(placedModel.worldToLocal(point.clone()));
    }
  });

  renderer.domElement.addEventListener('pointerup', (event) => {
    if (!isDraggingNewPin || !pendingPinPreview || !placedModel) return;
    isDraggingNewPin = false;

    // ドラッグ中に表示していた位置(=メッシュ上の点)を、そのまま保存位置とする
    const finalLocalPos = pendingPinPreview.position.clone();
    placedModel.remove(pendingPinPreview);
    pendingPinPreview = null;

    // 1件分の配置操作が終わったら、誤って連続で追加されないよう自動でモードをOFFに戻す
    setCommentModeActive(false);

    const worldPos = placedModel.localToWorld(finalLocalPos.clone());
    captureKeyboardComment('').then((text) => {
      if (!text) return;
      // 画像添付はAR中に行わない(BIM表示アプリ側で安全に行えるようになったため)。
      // テキストのみ保存する。
      addCommentPin(worldPos, text, null);
      saveAppState();
    });
  });
}

// ARセッションを自分で開始する(ARButtonのUIは使わず、直接WebXR APIを呼ぶ)
async function startARSession() {
  if (!navigator.xr) {
    fileLabel.textContent = 'このブラウザはARに対応していません';
    return;
  }
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['dom-overlay', 'depth-sensing'],
      domOverlay: { root: document.body },
      depthSensing: {
        usagePreference: ['cpu-optimized'],
        dataFormatPreference: ['luminance-alpha', 'float32'],
      },
    });
    // 実際にDepth Sensingが有効になったか、どの形式で提供されるかを
    // 記録しておく(「点で合わせる」で深度が取れない時の切り分け用)
    arDepthUsage = session.depthUsage || null;
    arDepthDataFormat = session.depthDataFormat || null;
    // Three.jsは既定で「local-floor」という特殊な基準空間を要求しようとするが、
    // これは明示的にリクエストしないと使えないことがあるため、
    // より基本的で対応の広い「local」を明示的に指定する。
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
  } catch (err) {
    console.error('ARセッションの開始に失敗しました', err);
    fileLabel.textContent = `AR開始失敗: ${err.name || ''} ${err.message || err}`;
    // 自動開始に失敗した場合のフォールバック。
    // これは新規のユーザー操作(ボタンクリック)なので、ブラウザの制約に必ず適合する。
    manualArStartBtn.style.display = 'block';
  }
}

// 初期画面・横向き案内画面に、このHTMLファイル自体の最終更新日時を表示する。
// (サーバーにアップロードした日時をブラウザが自動的に読み取ってくれるため、
//  手動でバージョン番号を管理する必要がない)
function formatLastModified() {
  const date = new Date(document.lastModified);
  if (isNaN(date.getTime())) {
    return `アップデート：${document.lastModified}`;
  }
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const hh = String(date.getHours()).padStart(2, '0');
  const mm = String(date.getMinutes()).padStart(2, '0');
  return `アップデート：${y}年${m}月${d}日 ${hh}:${mm}`;
}

// 中間ファイル(BIM表示アプリ側で書き出したJSON)を読み込み、
// 保存データ(localStorage)に反映する。これにより、BIMアプリ側で
// 追加された画像・コメントを、ARアプリ側でも続きから使えるようになる。
// data URL(base64)を、そのままFileオブジェクトに戻すヘルパー
function dataUrlToFile(dataUrl, fileName) {
  const [header, base64Data] = dataUrl.split(',');
  const mimeMatch = header.match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new File([bytes], fileName, { type: mime });
}

document.getElementById('intermediate-file-input').addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const state = JSON.parse(reader.result);
      if (!state || !state.fileName) {
        alert('JSONファイルの形式が正しくないようです');
        return;
      }
      // 古い形式の中間ファイル(modelKeyを持たない)にも一応対応しておく
      const modelKey = state.modelKey || computeModelKey(state.fileName, 0);

      // モデル本体が埋め込まれていれば、IndexedDBキャッシュに復元しておく。
      // (これで「モデルファイルを選び直す」手間がなくなり、
      //  中間ファイル1つだけで別端末でも復元できる)
      let modelIncluded = false;
      if (state.modelFileBase64) {
        const modelFile = dataUrlToFile(state.modelFileBase64, state.fileName);
        await cacheModelFile(modelKey, modelFile);
        modelIncluded = true;
        delete state.modelFileBase64; // localStorageを圧迫しないよう、保存前に取り除く
      }

      // 古い形式のピンをentries形式に変換したうえで、JSONから読み込んだ
      // 時点の全entryを「ロック」する(書き間違い修正のため、追記前の内容は
      // 編集・削除できないようにする。ロックはBIM表示アプリ側の表示で使う)
      if (Array.isArray(state.commentPins)) {
        state.commentPins.forEach((pinData) => {
          const entries = normalizePinEntries(pinData).map((e) => ({ ...e, locked: true }));
          pinData.entries = entries;
          delete pinData.text;
          delete pinData.image;
        });
      }

      localStorage.setItem(appStateStorageKeyFor(modelKey), JSON.stringify(state));
      alert(
        modelIncluded
          ? `「${state.fileName}」をモデルごと読み込みました。\n一覧の「続きから再開」からすぐに開けます。`
          : `「${state.fileName}」のJSONファイルを読み込みました。\nモデルファイルを選択すると復元されます。`
      );
      location.reload();
    } catch (err) {
      alert('JSONファイルの読み込みに失敗しました');
    }
  };
  reader.readAsText(file);
});
